<text x="540" y="150" font-size="11" fill="#777" text-anchor="middle">10kΩ・Rb もここ</text>
<text x="500" y="280" font-size="12" fill="#222" text-anchor="middle">out が GND と同じ 0V に固定</text>
<text x="500" y="298" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">→ 暗くても ON にならない</text>
