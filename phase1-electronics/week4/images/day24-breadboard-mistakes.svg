<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">ブレッドボードのまちがい3つ：同じ行の穴は、中でつながっている</text>
<rect x="30" y="60" width="300" height="520" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="180" y="90" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">① 光センサーの両足が同じ行</text>
<text x="50" y="128" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">まちがい</text>
<text x="50" y="368" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">直したあと</text>
<rect x="350" y="60" width="300" height="520" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="500" y="90" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">② out（1行目）が GND に直結</text>
<text x="370" y="128" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">まちがい</text>
<text x="370" y="368" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">直したあと</text>
<rect x="670" y="60" width="300" height="520" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="820" y="90" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">③ トランジスタの足が同じ行</text>
<text x="690" y="128" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">まちがい</text>
<text x="690" y="368" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">直したあと</text>
