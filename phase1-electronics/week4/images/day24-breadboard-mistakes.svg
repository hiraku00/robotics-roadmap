<text x="540" y="390" font-size="11" fill="#e65100" text-anchor="middle" font-weight="bold">1行目 ＝ out</text>
<text x="500" y="560" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">GND につなぐのは光センサーの反対側だけ</text>
