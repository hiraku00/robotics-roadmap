<text x="820" y="250" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">C・B・E が全部つながる（ショート）</text>
<text x="820" y="268" font-size="12" fill="#222" text-anchor="middle">症状：明るくても点きっぱなしになる</text>
