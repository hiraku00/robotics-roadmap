<circle cx="120" cy="290" r="5" fill="#e65100"/>
<text x="106" y="296" font-size="16" fill="#e65100" text-anchor="end" font-weight="bold">out</text>
<path d="M120,290 L120,340" stroke="#222" stroke-width="3" fill="none"/>
<line x1="120" y1="340" x2="120" y2="355" stroke="#222" stroke-width="3"/><rect x="111" y="355" width="18" height="50" fill="#fff" stroke="#2e7d32" stroke-width="3"/><line x1="120" y1="405" x2="120" y2="420" stroke="#222" stroke-width="3"/>
<text x="100" y="376" font-size="14" fill="#2e7d32" text-anchor="end" font-weight="bold">光センサー</text>
<text x="100" y="396" font-size="12" fill="#2e7d32" text-anchor="end">(R_Photo)</text>
<line x1="50" y1="340" x2="100" y2="362" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<line x1="60" y1="330" x2="110" y2="352" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<path d="M120,420 L120,500" stroke="#222" stroke-width="3" fill="none"/>
<path d="M120,290 L250,290" stroke="#222" stroke-width="3" fill="none"/>
<line x1="250" y1="290" x2="265" y2="290" stroke="#222" stroke-width="3"/><rect x="265" y="281" width="50" height="18" fill="#fff" stroke="#1565c0" stroke-width="3"/><line x1="315" y1="290" x2="330" y2="290" stroke="#222" stroke-width="3"/>
<text x="290" y="270" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">Rb 1kΩ</text>
<path d="M330,290 L380,290 L380,400 L450,400" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="502" cy="400" r="34" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="450" y1="400" x2="490" y2="400" stroke="#222" stroke-width="3"/><line x1="490" y1="380" x2="490" y2="420" stroke="#222" stroke-width="5"/>
