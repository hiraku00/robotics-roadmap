<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">23日目：暗くなると LED が点く回路（電源は 5V だけ）</text>
<path d="M120,80 L520,80" stroke="#222" stroke-width="3" fill="none"/>
<path d="M120,500 L520,500" stroke="#222" stroke-width="3" fill="none"/>
<text x="60" y="86" font-size="18" fill="#222" text-anchor="start" font-weight="bold">5V</text>
<text x="60" y="506" font-size="16" fill="#222" text-anchor="start" font-weight="bold">GND</text>
<circle cx="120" cy="80" r="5" fill="#222"/>
<circle cx="120" cy="500" r="5" fill="#222"/>
<path d="M120,80 L120,130" stroke="#222" stroke-width="3" fill="none"/>
