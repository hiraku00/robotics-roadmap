<text x="528" y="450" font-size="14" fill="#222" text-anchor="start" font-weight="bold">E</text>
<path d="M520,80 L520,110" stroke="#222" stroke-width="3" fill="none"/>
<line x1="520" y1="110" x2="520" y2="125" stroke="#222" stroke-width="3"/><rect x="511" y="125" width="18" height="50" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="520" y1="175" x2="520" y2="190" stroke="#222" stroke-width="3"/>
<text x="540" y="156" font-size="15" fill="#222" text-anchor="start" font-weight="bold">Rc 300Ω</text>
<path d="M520,190 L520,230" stroke="#222" stroke-width="3" fill="none"/>
<line x1="520" y1="230" x2="520" y2="258" stroke="#222" stroke-width="3"/><path d="M506,258 L534,258 L520,282 z" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/><line x1="506" y1="282" x2="534" y2="282" stroke="#c62828" stroke-width="3"/><line x1="520" y1="282" x2="520" y2="310" stroke="#222" stroke-width="3"/>
<line x1="538" y1="266" x2="554" y2="254" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<line x1="538" y1="278" x2="554" y2="266" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<text x="564" y="276" font-size="15" fill="#222" text-anchor="start" font-weight="bold">LED</text>
<path d="M520,310 L520,350" stroke="#222" stroke-width="3" fill="none"/>
<path d="M520,450 L520,500" stroke="#222" stroke-width="3" fill="none"/>
<rect x="640" y="80" width="320" height="190" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="660" y="110" font-size="17" fill="#2e7d32" text-anchor="start" font-weight="bold">暗いとき</text>
<text x="660" y="140" font-size="14" fill="#222" text-anchor="start">光センサーの抵抗が大きい</text>
<text x="660" y="165" font-size="14" fill="#222" text-anchor="start">→ 光センサーが大きな段を取る</text>
<text x="660" y="190" font-size="14" fill="#222" text-anchor="start">→ out が高い（約 4.5V）</text>
<text x="660" y="215" font-size="14" fill="#222" text-anchor="start">→ ベース電流が流れて ON</text>
<text x="660" y="240" font-size="14" fill="#222" text-anchor="start">→ LED が点く</text>
<rect x="640" y="290" width="320" height="190" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="660" y="320" font-size="17" fill="#f57f17" text-anchor="start" font-weight="bold">明るいとき</text>
<text x="660" y="350" font-size="14" fill="#222" text-anchor="start">光センサーの抵抗が小さい</text>
<text x="660" y="375" font-size="14" fill="#222" text-anchor="start">→ 光センサーが小さな段を取る</text>
<text x="660" y="400" font-size="14" fill="#222" text-anchor="start">→ out が低い（約 0.45V）</text>
<text x="660" y="425" font-size="14" fill="#222" text-anchor="start">→ 0.7V に届かず OFF</text>
<text x="660" y="450" font-size="14" fill="#222" text-anchor="start">→ LED は消える</text>
<text x="320" y="540" font-size="13" fill="#777" text-anchor="middle">左：明るさを電圧に変える（分圧）　右：LED を ON / OFF する（17日目のスイッチ）</text>
</svg>