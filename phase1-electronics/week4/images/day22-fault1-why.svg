<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="500.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">故障①：Rb を大きくすると、なぜ C の電圧が上がるのか</text>
<rect x="30" y="70" width="215" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="137" y="105" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">Rb が大きくなる</text>
<text x="137" y="138" font-size="14" fill="#222" text-anchor="middle">4.7kΩ → 100kΩ</text>
<line x1="247" y1="115" x2="273" y2="115" stroke="#222" stroke-width="3" marker-end="url(#ak)"/>
<rect x="275" y="70" width="215" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="382" y="105" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">ベース電流が減る</text>
<text x="382" y="138" font-size="14" fill="#222" text-anchor="middle">914µA → 43.1µA</text>
<line x1="492" y1="115" x2="518" y2="115" stroke="#222" stroke-width="3" marker-end="url(#ak)"/>
<rect x="520" y="70" width="215" height="90" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="627" y="105" font-size="16" fill="#e65100" text-anchor="middle" font-weight="bold">蛇口が開ききらない</text>
<text x="627" y="138" font-size="14" fill="#222" text-anchor="middle">C–E の抵抗 2.6Ω → 13Ω</text>
<line x1="737" y1="115" x2="763" y2="115" stroke="#222" stroke-width="3" marker-end="url(#ak)"/>
<rect x="765" y="70" width="215" height="90" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="872" y="105" font-size="16" fill="#e65100" text-anchor="middle" font-weight="bold">C の電圧が上がる</text>
<text x="872" y="138" font-size="14" fill="#222" text-anchor="middle">0.026V → 0.127V</text>
<text x="277" y="185" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">小さい道（Rb の道）</text>
<text x="767" y="185" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">大きい道（LED の道）</text>
<line x1="522" y1="200" x2="522" y2="560" stroke="#ddd" stroke-width="2" stroke-dasharray="6,6"/>
<text x="40" y="230" font-size="15" fill="#222" text-anchor="start" font-weight="bold">Rb にかかる電圧は 4.3V のまま（変わらない）</text>
<rect x="40" y="250" width="90" height="36" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="85" y="274" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">5V</text>
<line x1="180" y1="268" x2="195" y2="268" stroke="#222" stroke-width="3"/><rect x="195" y="259" width="50" height="18" fill="#fff" stroke="#1565c0" stroke-width="3"/><line x1="245" y1="268" x2="260" y2="268" stroke="#222" stroke-width="3"/>
<path d="M130,268 L180,268" stroke="#222" stroke-width="3" fill="none"/>
<path d="M260,268 L330,268" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="330" cy="268" r="5" fill="#222"/>
<text x="330" y="252" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">B 0.7V</text>
<path d="M330,268 L400,268" stroke="#222" stroke-width="3" fill="none"/>
<text x="410" y="274" font-size="14" fill="#222" text-anchor="start" font-weight="bold">E 0V</text>
<path d="M130,300 L330,300" stroke="#c62828" stroke-width="2" fill="none"/>
<text x="230" y="322" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">5.0 − 0.7 ＝ 4.3V</text>
<text x="40" y="365" font-size="15" fill="#222" text-anchor="start" font-weight="bold">ベース電流 ＝ 4.3V ÷ Rb（I ＝ V ÷ R）</text>
<text x="40" y="402" font-size="14" fill="#222" text-anchor="start">正常 4.7k</text>
<rect x="130" y="385" width="300.0" height="24" fill="#1565c0" rx="3"/>
<text x="438.0" y="403" font-size="14" fill="#222" text-anchor="start" font-weight="bold">914µA</text>
<text x="40" y="437" font-size="14" fill="#222" text-anchor="start">① 100k</text>
<rect x="130" y="420" width="14.146608315098469" height="24" fill="#1565c0" rx="3"/>
<text x="152.14660831509846" y="438" font-size="14" fill="#222" text-anchor="start" font-weight="bold">43.1µA（1/21）</text>
<text x="40" y="485" font-size="14" fill="#222" text-anchor="start">同じ 4.3V で押しても、抵抗が 21 倍なら</text>
<text x="40" y="508" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">電流は 1/21。電圧ではなく電流が変わる</text>
<text x="545" y="230" font-size="15" fill="#222" text-anchor="start" font-weight="bold">C の電圧 ＝ 蛇口（C–E）が取る電圧の段</text>
<text x="545" y="255" font-size="13" fill="#777" text-anchor="start">通りにくい部品ほど、大きく電圧を取る（直列の分け合い）</text>
<text x="545" y="297" font-size="14" fill="#222" text-anchor="start">正常</text>
<rect x="630" y="280" width="33.8" height="24" fill="#e65100" rx="3"/>
<text x="671.8" y="298" font-size="14" fill="#222" text-anchor="start" font-weight="bold">0.026V（実質 2.6Ω）</text>
<text x="545" y="332" font-size="14" fill="#222" text-anchor="start">①</text>
<rect x="630" y="315" width="165.1" height="24" fill="#e65100" rx="3"/>
<text x="803.1" y="333" font-size="14" fill="#222" text-anchor="start" font-weight="bold">0.127V（実質 13Ω）</text>
<text x="545" y="380" font-size="15" fill="#222" text-anchor="start" font-weight="bold">大きい道の 9V の分け合い</text>
<text x="555" y="410" font-size="14" fill="#222" text-anchor="start" font-weight="bold"></text>
<text x="760" y="410" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">正常</text>
<text x="880" y="410" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">①</text>
<text x="555" y="440" font-size="14" fill="#222" text-anchor="start">Rc</text>
<text x="760" y="440" font-size="14" fill="#222" text-anchor="middle">3.00V</text>
<text x="880" y="440" font-size="14" fill="#222" text-anchor="middle">2.92V</text>
<text x="555" y="470" font-size="14" fill="#222" text-anchor="start">LED 3個</text>
<text x="760" y="470" font-size="14" fill="#222" text-anchor="middle">5.95V</text>
<text x="880" y="470" font-size="14" fill="#222" text-anchor="middle">5.94V</text>
<text x="555" y="500" font-size="14" fill="#e65100" text-anchor="start" font-weight="bold">C–E（蛇口）</text>
<text x="760" y="500" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">0.026V</text>
<text x="880" y="500" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">0.127V</text>
<text x="555" y="530" font-size="14" fill="#222" text-anchor="start">合計</text>
<text x="760" y="530" font-size="14" fill="#222" text-anchor="middle">8.98V</text>
<text x="880" y="530" font-size="14" fill="#222" text-anchor="middle">8.99V</text>
<text x="545" y="570" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">大きくなったのは Rb ではなく、蛇口（C–E）の「抵抗」</text>
</svg>