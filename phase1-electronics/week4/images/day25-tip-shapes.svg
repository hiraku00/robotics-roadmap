<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="330" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">こて先の4つの形</text>
<rect x="90" y="60" width="50" height="40" fill="#9e9e9e"/>
<g transform="translate(90,100)"><path d="M0,0 L50,0 L28,110 L22,110 Z" fill="#bdbdbd" stroke="#616161" stroke-width="2"/></g>
<text x="115" y="245" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">円錐型</text>
<text x="115" y="272" font-size="13" fill="#777" text-anchor="middle">一般的な形。先が細く</text>
<text x="115" y="294" font-size="13" fill="#777" text-anchor="middle">細かい作業にも向く</text>
<rect x="320" y="60" width="50" height="40" fill="#9e9e9e"/>
<g transform="translate(320,100)"><path d="M0,0 L50,0 L42,110 L8,110 Z" fill="#bdbdbd" stroke="#616161" stroke-width="2"/></g>
<text x="345" y="245" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">チゼル型</text>
<text x="345" y="272" font-size="13" fill="#777" text-anchor="middle">先が平らで広い</text>
<text x="345" y="294" font-size="13" fill="#777" text-anchor="middle">熱をたくさん伝える（線材）</text>
<rect x="550" y="60" width="50" height="40" fill="#9e9e9e"/>
<g transform="translate(550,100)"><path d="M0,0 L50,0 L50,70 L0,110 Z" fill="#bdbdbd" stroke="#616161" stroke-width="2"/></g>
<text x="575" y="245" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">ベベル型</text>
<text x="575" y="272" font-size="13" fill="#777" text-anchor="middle">先を斜めに切った形</text>
<text x="575" y="294" font-size="13" fill="#777" text-anchor="middle">引きはんだ・多めのはんだ</text>
<rect x="780" y="60" width="50" height="40" fill="#9e9e9e"/>
<g transform="translate(780,100)"><path d="M0,0 L50,0 L50,110 L44,110 L0,60 Z" fill="#bdbdbd" stroke="#616161" stroke-width="2"/></g>
<text x="805" y="245" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">ナイフ型</text>
<text x="805" y="272" font-size="13" fill="#777" text-anchor="middle">ナイフの刃の形</text>
<text x="805" y="294" font-size="13" fill="#777" text-anchor="middle">狭い所・ブリッジの修正</text>
</svg>