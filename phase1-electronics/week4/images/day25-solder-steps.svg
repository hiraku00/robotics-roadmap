<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="520" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">はんだ付けの手順：声に出して数える（1 カウント ≒ 1 秒）</text>
<line x1="150" y1="90" x2="150" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="230" y1="90" x2="230" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="310" y1="90" x2="310" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="390" y1="90" x2="390" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="470" y1="90" x2="470" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="550" y1="90" x2="550" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="630" y1="90" x2="630" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="710" y1="90" x2="710" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="790" y1="90" x2="790" y2="300" stroke="#eee" stroke-width="1.5"/>
<line x1="870" y1="90" x2="870" y2="300" stroke="#eee" stroke-width="1.5"/>
<text x="190.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<text x="270.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">2</text>
<text x="350.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">3</text>
<text x="430.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">4</text>
<text x="510.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<text x="590.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">2</text>
<text x="670.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">3</text>
<text x="750.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">4</text>
<text x="830.0" y="84" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">5</text>
<text x="138" y="84" font-size="13" fill="#777" text-anchor="end">カウント</text>
<text x="138" y="140" font-size="15" fill="#c62828" text-anchor="end" font-weight="bold">はんだごて</text>
<rect x="150" y="122" width="720" height="30" rx="6" fill="#c62828" fill-opacity="0.75"/>
<text x="160" y="143" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">リードとランドに当てたまま</text>
<text x="138" y="210" font-size="15" fill="#1565c0" text-anchor="end" font-weight="bold">はんだ線</text>
<rect x="470" y="192" width="160" height="30" rx="6" fill="#1565c0" fill-opacity="0.75"/>
<text x="480" y="213" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">当てる</text>
<rect x="153" y="250" width="314" height="70" rx="6" fill="#ffebee" stroke="#ccc" stroke-width="2"/>
<text x="310.0" y="278" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">① 温める</text>
<text x="310.0" y="302" font-size="12" fill="#777" text-anchor="middle">リードとランドの両方</text>
<rect x="473" y="250" width="154" height="70" rx="6" fill="#e3f2fd" stroke="#ccc" stroke-width="2"/>
<text x="550.0" y="278" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">② はんだを入れる</text>
<text x="550.0" y="302" font-size="12" fill="#777" text-anchor="middle">こて先とリードの間へ</text>
<rect x="633" y="250" width="154" height="70" rx="6" fill="#fffde7" stroke="#ccc" stroke-width="2"/>
<text x="710.0" y="278" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">③ はんだを離す</text>
<text x="710.0" y="302" font-size="12" fill="#777" text-anchor="middle">穴に流れ込むのを待つ</text>
<rect x="793" y="250" width="74" height="70" rx="6" fill="#e8f5e9" stroke="#ccc" stroke-width="2"/>
<text x="830.0" y="278" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">④ こて</text>
<text x="830.0" y="302" font-size="12" fill="#777" text-anchor="middle">を離す</text>
<rect x="40" y="350" width="900" height="150" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="60" y="385" font-size="14" fill="#222" text-anchor="start">・温まる前にはんだを当てると、はんだがきれいに流れない（イモはんだの原因）</text>
<text x="60" y="415" font-size="14" fill="#222" text-anchor="start">・先に離すのは「はんだ線」。こてはそのまま 2 つ数えて、溶けたはんだを穴に流し込む</text>
<text x="60" y="445" font-size="14" fill="#222" text-anchor="start">・こてを離したら、はんだが固まるまで部品を動かさない</text>
<text x="60" y="475" font-size="14" fill="#222" text-anchor="start">・終わったら、こて先をスポンジ（またはクリーナー）でふいて、こて台に戻す</text>
</svg>