<text x="282" y="388" font-size="12" fill="#1565c0" text-anchor="start">赤：out　黒：GND</text>
<rect x="715" y="90" width="250" height="230" rx="10" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<text x="730" y="120" font-size="15" fill="#222" text-anchor="start" font-weight="bold">テスターの2つのつなぎ方</text>
<text x="730" y="150" font-size="13" fill="#222" text-anchor="start">電圧計：測りたい点に当てるだけ</text>
<text x="730" y="176" font-size="13" fill="#222" text-anchor="start">　（並列。回路は切らない）</text>
<text x="730" y="202" font-size="13" fill="#222" text-anchor="start">電流計：線を切って、あいだに</text>
<text x="730" y="228" font-size="13" fill="#222" text-anchor="start">　はさむ（直列。電流が中を通る）</text>
<text x="730" y="254" font-size="13" fill="#c62828" text-anchor="start">電流計を足したら元の線は消す</text>
<text x="730" y="280" font-size="13" fill="#c62828" text-anchor="start">　（残すと電流がそっちを通る）</text>
