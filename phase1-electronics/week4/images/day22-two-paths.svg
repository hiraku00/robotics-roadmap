<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="1000" height="620" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="500.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">この回路は「2本の道」：大きい道（LED）と小さい道（指令）</text>
<path d="M100,290 L100,90 L420,90 L420,560 L100,560 L100,370" stroke="#e65100" stroke-width="16" fill="none" stroke-opacity="0.25" stroke-linejoin="round"/>
<path d="M205,480 L205,460 L350,460 L420,500 L420,560 L205,560 L205,480" stroke="#1565c0" stroke-width="10" fill="none" stroke-opacity="0.25" stroke-linejoin="round"/>
<line x1="100" y1="290" x2="100" y2="324" stroke="#222" stroke-width="3"/><line x1="80" y1="324" x2="120" y2="324" stroke="#222" stroke-width="3"/><line x1="90" y1="336" x2="110" y2="336" stroke="#222" stroke-width="6"/><line x1="100" y1="336" x2="100" y2="370" stroke="#222" stroke-width="3"/>
<text x="116" y="318" font-size="14" fill="#777" text-anchor="start">+</text>
<text x="116" y="352" font-size="14" fill="#777" text-anchor="start">−</text>
<text x="60" y="335" font-size="16" fill="#222" text-anchor="end" font-weight="bold">9V</text>
<path d="M100,290 L100,90 L420,90" stroke="#222" stroke-width="3" fill="none"/>
<line x1="420" y1="90" x2="420" y2="105" stroke="#222" stroke-width="3"/><rect x="411" y="105" width="18" height="50" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="420" y1="155" x2="420" y2="170" stroke="#222" stroke-width="3"/>
<text x="398" y="136" font-size="15" fill="#222" text-anchor="end">Rc</text>
<line x1="420" y1="170" x2="420" y2="198" stroke="#222" stroke-width="3"/><path d="M406,198 L434,198 L420,222 z" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/><line x1="406" y1="222" x2="434" y2="222" stroke="#c62828" stroke-width="3"/><line x1="420" y1="222" x2="420" y2="250" stroke="#222" stroke-width="3"/>
<line x1="438" y1="206" x2="454" y2="194" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<line x1="438" y1="218" x2="454" y2="206" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<text x="398" y="216" font-size="15" fill="#222" text-anchor="end">LED1</text>
<line x1="420" y1="250" x2="420" y2="278" stroke="#222" stroke-width="3"/><path d="M406,278 L434,278 L420,302 z" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/><line x1="406" y1="302" x2="434" y2="302" stroke="#c62828" stroke-width="3"/><line x1="420" y1="302" x2="420" y2="330" stroke="#222" stroke-width="3"/>
<line x1="438" y1="286" x2="454" y2="274" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<line x1="438" y1="298" x2="454" y2="286" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<text x="398" y="296" font-size="15" fill="#222" text-anchor="end">LED2</text>
<line x1="420" y1="330" x2="420" y2="358" stroke="#222" stroke-width="3"/><path d="M406,358 L434,358 L420,382 z" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/><line x1="406" y1="382" x2="434" y2="382" stroke="#c62828" stroke-width="3"/><line x1="420" y1="382" x2="420" y2="410" stroke="#222" stroke-width="3"/>
<line x1="438" y1="366" x2="454" y2="354" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<line x1="438" y1="378" x2="454" y2="366" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<text x="398" y="376" font-size="15" fill="#222" text-anchor="end">LED3</text>
<circle cx="402" cy="460" r="34" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="350" y1="460" x2="390" y2="460" stroke="#222" stroke-width="3"/><line x1="390" y1="440" x2="390" y2="480" stroke="#222" stroke-width="5"/>
<path d="M390,452 L420,432 L420,410" stroke="#222" stroke-width="3" fill="none"/>
<path d="M390,468 L420,488 L420,510" stroke="#222" stroke-width="3" fill="none"/>
<path d="M420,488 L407,486 L413,477 z" fill="#222"/>
<path d="M420,510 L420,560" stroke="#222" stroke-width="3" fill="none"/>
<path d="M100,370 L100,560 L420,560" stroke="#222" stroke-width="3" fill="none"/>
<rect x="150" y="440" width="110" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="205" y="466" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">Arduino 5V</text>
<path d="M205,480 L205,560" stroke="#222" stroke-width="3" fill="none"/>
<line x1="290" y1="460" x2="305" y2="460" stroke="#222" stroke-width="3"/><rect x="305" y="451" width="50" height="18" fill="#fff" stroke="#1565c0" stroke-width="3"/><line x1="355" y1="460" x2="370" y2="460" stroke="#222" stroke-width="3"/>
<text x="330" y="440" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">Rb</text>
<path d="M260,460 L290,460" stroke="#222" stroke-width="3" fill="none"/>
<path d="M370,460 L350,460" stroke="#222" stroke-width="3" fill="none"/>
<text x="432" y="418" font-size="18" fill="#222" text-anchor="start" font-weight="bold">C</text>
<text x="334" y="486" font-size="18" fill="#222" text-anchor="start" font-weight="bold">B</text>
<text x="432" y="530" font-size="18" fill="#222" text-anchor="start" font-weight="bold">E</text>
<circle cx="240" cy="560" r="5" fill="#222"/>
<text x="240" y="590" font-size="14" fill="#222" text-anchor="middle">GND（0V）：2本の道の合流点</text>
<rect x="540" y="70" width="430" height="120" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="560" y="100" font-size="16" fill="#e65100" text-anchor="start" font-weight="bold">大きい道（約 10mA）：LED を光らせる</text>
<text x="560" y="128" font-size="14" fill="#222" text-anchor="start">9V → Rc → LED1 → LED2 → LED3 → C → E → GND</text>
<text x="560" y="156" font-size="14" fill="#222" text-anchor="start">電池の 9V を、Rc・LED・トランジスタで分け合う</text>
<text x="560" y="178" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">Rb はこの道に入っていない</text>
<rect x="540" y="205" width="430" height="95" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="560" y="235" font-size="16" fill="#1565c0" text-anchor="start" font-weight="bold">小さい道（約 1mA）：「開け」の指令</text>
<text x="560" y="263" font-size="14" fill="#222" text-anchor="start">Arduino 5V → Rb → B → E → GND</text>
<text x="560" y="288" font-size="14" fill="#222" text-anchor="start">B と E の間はいつも約 0.7V</text>
<rect x="540" y="320" width="430" height="250" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
<text x="560" y="350" font-size="16" fill="#222" text-anchor="start" font-weight="bold">トランジスタは 3本足の蛇口</text>
<rect x="610" y="420" width="60" height="60" rx="8" fill="#eceff1" stroke="#222" stroke-width="2"/>
<path d="M640,375 L640,420" stroke="#e65100" stroke-width="6" fill="none"/>
<path d="M640,480 L640,535" stroke="#e65100" stroke-width="6" fill="none"/>
<path d="M560,450 L610,450" stroke="#1565c0" stroke-width="4" fill="none"/>
<circle cx="640" cy="450" r="14" fill="#fff" stroke="#1565c0" stroke-width="3"/><line x1="630" y1="450" x2="650" y2="450" stroke="#1565c0" stroke-width="3"/>
<text x="654" y="390" font-size="14" fill="#222" text-anchor="start" font-weight="bold">C：水の入口（LED の下）</text>
<text x="565" y="440" font-size="15" fill="#1565c0" text-anchor="start" font-weight="bold">B</text>
<text x="684" y="446" font-size="14" fill="#1565c0" text-anchor="start" font-weight="bold">B：ハンドル</text>
<text x="684" y="468" font-size="13" fill="#1565c0" text-anchor="start">ベース電流が多いほど大きく開く</text>
<text x="654" y="530" font-size="14" fill="#222" text-anchor="start" font-weight="bold">E：水の出口（GND、いつも 0V）</text>
<text x="560" y="558" font-size="13" fill="#777" text-anchor="start">足の並び：平らな面を手前に、左から C・B・E</text>
</svg>