<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="570" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">落とし穴：ベース電流は、上の 10kΩ も通る</text>
<rect x="40" y="70" width="900" height="150" rx="10" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<rect x="60" y="106" width="70" height="36" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="95" y="130" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">5V</text>
<line x1="160" y1="124" x2="175" y2="124" stroke="#222" stroke-width="3"/><rect x="175" y="115" width="50" height="18" fill="#fff" stroke="#222" stroke-width="3"/><line x1="225" y1="124" x2="240" y2="124" stroke="#222" stroke-width="3"/>
<text x="200" y="104" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">10kΩ</text>
<path d="M130,124 L160,124" stroke="#222" stroke-width="3" fill="none"/>
<path d="M240,124 L310,124" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="310" cy="124" r="5" fill="#e65100"/>
<text x="310" y="104" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">out</text>
<line x1="340" y1="124" x2="355" y2="124" stroke="#222" stroke-width="3"/><rect x="355" y="115" width="50" height="18" fill="#fff" stroke="#1565c0" stroke-width="3"/><line x1="405" y1="124" x2="420" y2="124" stroke="#222" stroke-width="3"/>
<text x="380" y="104" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">Rb</text>
<path d="M340,124" stroke="#222" stroke-width="3" fill="none"/>
<path d="M310,124 L340,124" stroke="#222" stroke-width="3" fill="none"/>
<path d="M420,124 L470,124" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="470" cy="124" r="5" fill="#222"/>
<text x="482" y="129" font-size="14" fill="#222" text-anchor="start" font-weight="bold">B（0.7V）→ E → GND</text>
<text x="60" y="180" font-size="13" fill="#777" text-anchor="start">暗いとき、光センサーにはほぼ流れない → 10kΩ と Rb の直列とみなせる</text>
<text x="60" y="206" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">ベース電流 ＝ (5 − 0.7) ÷ (10k ＋ Rb)</text>
<text x="288" y="280" font-size="14" fill="#222" text-anchor="end">最初の計算（out が 4.55V のまま）</text>
<rect x="300" y="260" width="460.1" height="30" fill="#bbb" rx="3" fill-opacity="0.5" stroke-dasharray="5,4" stroke="#888"/>
<text x="768.1" y="281" font-size="14" fill="#222" text-anchor="start" font-weight="bold">1.07mA（実際は流れない）</text>
<text x="288" y="332" font-size="14" fill="#222" text-anchor="end">Rb 3.6kΩ</text>
<rect x="300" y="312" width="135.95588235294116" height="30" fill="#1565c0" rx="3" />
<text x="443.95588235294116" y="333" font-size="14" fill="#222" text-anchor="start" font-weight="bold">0.32mA</text>
<text x="288" y="384" font-size="14" fill="#222" text-anchor="end" font-weight="bold">Rb 1kΩ（採用）</text>
<rect x="300" y="364" width="168.09090909090907" height="30" fill="#2e7d32" rx="3" />
<text x="476.09090909090907" y="385" font-size="14" fill="#222" text-anchor="start" font-weight="bold">0.39mA</text>
<text x="288" y="436" font-size="14" fill="#222" text-anchor="end">Rb なし（限界）</text>
<rect x="300" y="416" width="184.9" height="30" fill="#777" rx="3" />
<text x="492.9" y="437" font-size="14" fill="#222" text-anchor="start" font-weight="bold">0.43mA</text>
<line x1="343.0" y1="245" x2="343.0" y2="470" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
<text x="343.0" y="490" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">最低限 0.1mA</text>
<line x1="730.0" y1="245" x2="730.0" y2="470" stroke="#e65100" stroke-width="2" stroke-dasharray="6,4"/>
<text x="730.0" y="490" font-size="13" fill="#e65100" text-anchor="middle" font-weight="bold">目標 1mA（10 倍）</text>
<text x="490" y="535" font-size="13" fill="#222" text-anchor="middle">どの Rb でも 0.43mA より多くは流れない → 目標を「届く範囲でできるだけ多く」に変えて 1kΩ（最低限の約 4 倍）</text>
</svg>