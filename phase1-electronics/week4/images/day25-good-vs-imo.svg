<text x="250" y="100" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold">良いはんだ</text>
<ellipse cx="730" cy="248" rx="58" ry="40" fill="#b0bec5" stroke="#546e7a" stroke-width="2"/>
<rect x="724" y="180" width="12" height="130" fill="#9e9e9e"/>
<line x1="672" y1="290" x2="788" y2="290" stroke="#c62828" stroke-width="2" stroke-dasharray="4,3"/>
<text x="730" y="100" font-size="18" fill="#c62828" text-anchor="middle" font-weight="bold">イモはんだ</text>
<text x="250" y="400" font-size="14" fill="#2e7d32" text-anchor="middle">✓ すそがなだらかに広がる（富士山の形）</text>
<text x="250" y="426" font-size="14" fill="#2e7d32" text-anchor="middle">✓ リード・ランドとなじんでいる</text>
<text x="250" y="452" font-size="14" fill="#2e7d32" text-anchor="middle">✓ 穴の中まで流れ込んでいる</text>
<text x="730" y="400" font-size="14" fill="#c62828" text-anchor="middle">✗ 表面にボテッと玉のようにのる</text>
<text x="730" y="426" font-size="14" fill="#c62828" text-anchor="middle">✗ ランドとのあいだがなじんでいない（赤の点線）</text>
<text x="730" y="452" font-size="14" fill="#c62828" text-anchor="middle">✗ → 電気が通らない・部品が取れる</text>
<text x="490" y="505" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">原因：リードとランドが温まる前にはんだを当てた／表面が酸化していた</text>
