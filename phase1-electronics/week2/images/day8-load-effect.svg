<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="490" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#222">負荷をつなぐと、出力が下がる理由</text>

  <!-- step 1 -->
  <text x="160" y="85" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">① 負荷なし</text>
  <g stroke="#222" stroke-width="3" fill="none">
    <path d="M160,100 V130"/><rect x="145" y="130" width="30" height="60" fill="#fff"/>
    <path d="M160,190 V230"/><rect x="145" y="230" width="30" height="60" fill="#fff"/>
    <path d="M160,290 V320"/>
  </g>
  <circle cx="160" cy="210" r="5" fill="#c62828"/>
  <g font-size="16" fill="#222"><text x="185" y="166">R1 5k</text><text x="185" y="266">R2 10k</text></g>
  <text x="160" y="350" font-size="17" text-anchor="middle">下側 = 10k</text>
  <text x="160" y="380" font-size="20" text-anchor="middle" font-weight="bold" fill="#c62828">出力 6.00V</text>

  <text x="300" y="215" font-size="34" fill="#888">→</text>

  <!-- step 2 -->
  <text x="490" y="85" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">② 負荷 RL をつなぐ</text>
  <g stroke="#222" stroke-width="3" fill="none">
    <path d="M450,100 V130"/><rect x="435" y="130" width="30" height="60" fill="#fff"/>
    <path d="M450,190 V215 H530 V230"/><path d="M450,215 V230"/>
    <rect x="435" y="230" width="30" height="60" fill="#fff"/>
    <rect x="515" y="230" width="30" height="60" fill="#fff" stroke="#1565c0"/>
    <path d="M450,290 V305 H530 V290"/><path d="M450,305 V320"/>
  </g>
  <circle cx="450" cy="215" r="5" fill="#c62828"/>
  <g font-size="16" fill="#222"><text x="475" y="166">R1 5k</text><text x="370" y="266">R2 10k</text><text x="555" y="266" fill="#1565c0">RL 15k</text></g>
  <text x="490" y="350" font-size="17" text-anchor="middle">R2 と RL が並列</text>
  <text x="490" y="375" font-size="15" text-anchor="middle" fill="#555">道が2本になって流れやすくなる</text>

  <text x="640" y="215" font-size="34" fill="#888">→</text>

  <!-- step 3 -->
  <text x="810" y="85" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">③ 1本にまとめると</text>
  <g stroke="#222" stroke-width="3" fill="none">
    <path d="M810,100 V130"/><rect x="795" y="130" width="30" height="60" fill="#fff"/>
    <path d="M810,190 V245"/><rect x="795" y="245" width="30" height="40" fill="#fff"/>
    <path d="M810,285 V320"/>
  </g>
  <circle cx="810" cy="215" r="5" fill="#c62828"/>
  <g font-size="16" fill="#222"><text x="835" y="166">R1 5k</text><text x="835" y="272">6k</text></g>
  <text x="810" y="350" font-size="17" text-anchor="middle">下側 = 10k → 6k に減る</text>
  <text x="810" y="380" font-size="20" text-anchor="middle" font-weight="bold" fill="#c62828">出力 4.91V</text>

  <rect x="60" y="410" width="860" height="48" fill="#f4f6fb" stroke="#c5cbe0"/>
  <text x="490" y="432" font-size="16" text-anchor="middle" fill="#222">並列のまとめ方：10 × 15 ÷ (10 + 15) = 6k　→　出力 = 9 × 6 ÷ (5 + 6) ≒ 4.91V</text>
  <text x="490" y="452" font-size="15" text-anchor="middle" fill="#555">下側の抵抗が小さくなると、下側が受け持つ電圧も小さくなる</text>
</svg>
