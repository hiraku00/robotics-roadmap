<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="490" y="40" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">Tinkercad の回路図で線が切れて見える理由</text>

  <!-- left: breadboard reality -->
  <text x="245" y="85" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">① 実際の回路（ブレッドボード）</text>
  <g stroke="#222" stroke-width="3" fill="none">
    <path d="M90,130 H170"/>
    <path d="M250,130 H330 V180"/>
    <rect x="315" y="180" width="30" height="50" fill="#fff"/>
    <path d="M330,230 V260"/>
    <rect x="315" y="260" width="30" height="50" fill="#fff"/>
    <path d="M330,310 V350 H90 V250"/>
    <path d="M90,210 V130"/>
    <line x1="70" y1="210" x2="110" y2="210" stroke-width="4"/>
    <line x1="80" y1="228" x2="100" y2="228" stroke-width="7"/>
  </g>
  <rect x="170" y="110" width="80" height="40" rx="6" fill="#fbc02d" stroke="#b28704" stroke-width="2"/>
  <text x="210" y="137" font-size="18" text-anchor="middle" font-weight="bold" fill="#222">A</text>
  <g font-size="15" fill="#222">
    <text x="20" y="225">電源</text>
    <text x="355" y="210">LED</text>
    <text x="355" y="290">抵抗</text>
    <text x="210" y="175" text-anchor="middle" fill="#8a6d00">電流計</text>
  </g>
  <text x="245" y="395" font-size="16" text-anchor="middle" fill="#222">電流は電流計の中を通って、1周している</text>

  <text x="490" y="230" font-size="34" fill="#888" text-anchor="middle">→</text>

  <!-- right: tinkercad schematic -->
  <text x="735" y="85" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">② Tinkercad の回路図表示</text>
  <g stroke="#222" stroke-width="3" fill="none">
    <path d="M580,130 H640"/>
    <path d="M760,130 H820 V180"/>
    <rect x="805" y="180" width="30" height="50" fill="#fff"/>
    <path d="M820,230 V260"/>
    <rect x="805" y="260" width="30" height="50" fill="#fff"/>
    <path d="M820,310 V350 H580 V250"/>
    <path d="M580,210 V130"/>
    <line x1="560" y1="210" x2="600" y2="210" stroke-width="4"/>
    <line x1="570" y1="228" x2="590" y2="228" stroke-width="7"/>
  </g>
  <rect x="660" y="110" width="80" height="40" rx="6" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="700" y="137" font-size="18" text-anchor="middle" fill="#c62828">？</text>
  <g font-size="15" fill="#222">
    <text x="845" y="210">LED</text>
    <text x="845" y="290">抵抗</text>
    <text x="700" y="175" text-anchor="middle" fill="#c62828">描かれない</text>
  </g>
  <text x="735" y="395" font-size="16" text-anchor="middle" fill="#c62828">電流計の場所が「すき間」になり、線が切れて見える</text>

  <rect x="60" y="415" width="860" height="44" fill="#f4f6fb" stroke="#c5cbe0"/>
  <text x="490" y="443" font-size="17" text-anchor="middle" fill="#222">マルチメーターは「測る道具」なので回路の部品として描かれない。<tspan font-weight="bold">電流計を1本の線に置き換えて読む</tspan></text>
</svg>
