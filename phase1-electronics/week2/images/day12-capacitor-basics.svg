<text x="259" y="212" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">−</text>
<text x="159" y="244" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">＋</text>
<text x="259" y="244" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">−</text>
