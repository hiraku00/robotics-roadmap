<text x="820" y="248" font-size="14" fill="#555" text-anchor="middle">＋の印がある側を＋につなぐ</text>
<rect x="450" y="285" width="480" height="110" rx="10" fill="#f4f6fb" stroke="#c5cbe0"/>
<text x="470" y="315" font-size="16" fill="#222" text-anchor="start" font-weight="bold">電解コンデンサの実物の見分け方</text>
<text x="470" y="342" font-size="15" fill="#222" text-anchor="start">・足の長いほうが＋</text>
<text x="470" y="366" font-size="15" fill="#222" text-anchor="start">・本体の帯（−の印）がある側が−</text>
<text x="470" y="390" font-size="15" fill="#c62828" text-anchor="start">・逆につなぐと壊れる（破裂することもある）</text>
</svg>