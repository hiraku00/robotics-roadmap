<text x="209" y="365" font-size="15" fill="#222" text-anchor="middle">2枚の板（電極）が向かい合っている</text>
<text x="209" y="388" font-size="15" fill="#222" text-anchor="middle">電池をつなぐと、片方に＋、もう片方に−がたまる</text>
<text x="209" y="411" font-size="15" fill="#c62828" text-anchor="middle">電気は板のあいだを通り抜けない</text>
