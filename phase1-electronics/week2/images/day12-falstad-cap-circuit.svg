<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="960" height="470" fill="#fff"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker></defs>
<text x="480.0" y="38" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">Falstad「コンデンサの例題」の回路</text>
<g transform="translate(110,255) rotate(90)"><line x1="-40" y1="0" x2="-6" y2="0" stroke="#222" stroke-width="3"/><line x1="-6" y1="-20" x2="-6" y2="20" stroke="#222" stroke-width="3"/><line x1="6" y1="-10" x2="6" y2="10" stroke="#222" stroke-width="6"/><line x1="6" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/></g>
<path d="M110,215 L110,110 L300,110" stroke="#222" stroke-width="3" fill="none"/>
<text x="85" y="250" font-size="20" fill="#222" text-anchor="end" font-weight="bold">5V</text>
<text x="125" y="240" font-size="15" fill="#555" text-anchor="start">＋</text>
<text x="125" y="282" font-size="15" fill="#555" text-anchor="start">−</text>
<circle cx="300" cy="110" r="4" fill="#222"/><circle cx="380" cy="110" r="4" fill="#222"/><circle cx="340" cy="185" r="4" fill="#222"/>
<line x1="340" y1="185" x2="304" y2="116" stroke="#222" stroke-width="3"/>
<line x1="340" y1="185" x2="376" y2="116" stroke="#bbb" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M380,110 L560,110 L560,400" stroke="#222" stroke-width="3" fill="none"/>
<path d="M340,185 L340,200" stroke="#222" stroke-width="3" fill="none"/>
<g transform="translate(340,240) rotate(90)"><line x1="-40" y1="0" x2="-6" y2="0" stroke="#222" stroke-width="3"/><line x1="-6" y1="-18" x2="-6" y2="18" stroke="#222" stroke-width="4"/><line x1="6" y1="-18" x2="6" y2="18" stroke="#222" stroke-width="4"/><line x1="6" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/></g>
<path d="M340,280 L340,290" stroke="#222" stroke-width="3" fill="none"/>
<g transform="translate(340,330) rotate(90)"><line x1="-40" y1="0" x2="-25" y2="0" stroke="#222" stroke-width="3"/><rect x="-25" y="-9" width="50" height="18" fill="#fff" stroke="#222" stroke-width="3"/><line x1="25" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/></g>
<path d="M340,370 L340,400" stroke="#222" stroke-width="3" fill="none"/>
<path d="M110,295 L110,400 L560,400" stroke="#222" stroke-width="3" fill="none"/>
<text x="372" y="245" font-size="16" fill="#1565c0" text-anchor="start" font-weight="bold">200µF（コンデンサ）</text>
<text x="375" y="335" font-size="16" fill="#222" text-anchor="start" font-weight="bold">100Ω</text>
<text x="270" y="90" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">左</text>
<text x="410" y="90" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">右</text>
<text x="255" y="170" font-size="15" fill="#222" text-anchor="end">スイッチ</text>
<rect x="600" y="100" width="340" height="120" rx="10" fill="#fbeaea" stroke="#c62828" stroke-width="2"/>
<text x="620" y="130" font-size="17" fill="#c62828" text-anchor="start" font-weight="bold">スイッチが左（実線）：充電</text>
<text x="620" y="158" font-size="14.5" fill="#222" text-anchor="start">電池 → スイッチ → コンデンサ → 100Ω</text>
<text x="620" y="180" font-size="14.5" fill="#222" text-anchor="start">→ 電池の− の輪ができる</text>
<text x="620" y="204" font-size="14.5" fill="#555" text-anchor="start">コンデンサに電気がたまる</text>
<rect x="600" y="240" width="340" height="120" rx="10" fill="#eaf5ea" stroke="#2e7d32" stroke-width="2"/>
<text x="620" y="270" font-size="17" fill="#2e7d32" text-anchor="start" font-weight="bold">スイッチが右（点線）：放電</text>
<text x="620" y="298" font-size="14.5" fill="#222" text-anchor="start">コンデンサ → 100Ω → 下の線 → 右の線</text>
<text x="620" y="320" font-size="14.5" fill="#222" text-anchor="start">→ スイッチ の輪（電池は入らない）</text>
<text x="620" y="344" font-size="14.5" fill="#555" text-anchor="start">たまった電気が抵抗で熱になって出ていく</text>
<text x="480" y="450" font-size="15" fill="#222" text-anchor="middle">どちらでも 100Ω を通るので、電流の勢いは 100Ω で決まる（最初の電流 5V ÷ 100Ω = 50mA）</text>
</svg>