<text x="250" y="370" font-size="15" fill="#222" text-anchor="middle">電流の通り道は1本。1個切れると全部消える</text>
<text x="252" y="358" font-size="1" fill="#222" text-anchor="start"></text>
<text x="220" y="316" font-size="15" fill="#555" text-anchor="start">＋</text>
<text x="270" y="316" font-size="15" fill="#555" text-anchor="start">−</text>
