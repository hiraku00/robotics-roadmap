<text x="690" y="316" font-size="15" fill="#555" text-anchor="start">＋</text>
<text x="740" y="316" font-size="15" fill="#555" text-anchor="start">−</text>
<text x="720" y="370" font-size="15" fill="#222" text-anchor="middle">道が2本に分かれる。1個切れても残りは光る</text>
<text x="480" y="405" font-size="14" fill="#555" text-anchor="middle">電池の記号：長い線（＋）から電流が出て、回路を1周して短い線（−）に戻る</text>
