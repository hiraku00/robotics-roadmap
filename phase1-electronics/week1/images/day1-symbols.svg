<text x="365" y="403" font-size="13.5" fill="#555" text-anchor="middle">丸に V。両端に当てる</text>
<text x="365" y="429" font-size="13.5" fill="#1565c0" text-anchor="middle">文字の図では (V)</text>
<rect x="490" y="265" width="210" height="180" rx="10" fill="#f6f8fc" stroke="#c5cbe0"/>
<g transform="translate(595,320) rotate(0)"><line x1="-40" y1="0" x2="-12" y2="0" stroke="#222" stroke-width="3"/><polygon points="-12,-14 -12,14 12,0" fill="#fff" stroke="#222" stroke-width="3"/><line x1="12" y1="-14" x2="12" y2="14" stroke="#222" stroke-width="3"/><line x1="12" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/><line x1="2" y1="-18" x2="12" y2="-30" stroke="#222" stroke-width="2" marker-end="url(#ak)"/><line x1="12" y1="-14" x2="22" y2="-26" stroke="#222" stroke-width="2" marker-end="url(#ak)"/></g>
<text x="595" y="377" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">LED</text>
<text x="595" y="403" font-size="13.5" fill="#555" text-anchor="middle">三角の向きにだけ電流が流れる</text>
<text x="595" y="429" font-size="13.5" fill="#1565c0" text-anchor="middle">文字の図では [LED]</text>
<rect x="720" y="265" width="210" height="180" rx="10" fill="#f6f8fc" stroke="#c5cbe0"/>
<path d="M825,295 L825,320" stroke="#222" stroke-width="3" fill="none"/><line x1="825" y1="320" x2="825" y2="332" stroke="#222" stroke-width="3"/><line x1="809" y1="332" x2="841" y2="332" stroke="#222" stroke-width="3"/><line x1="815" y1="339" x2="835" y2="339" stroke="#222" stroke-width="3"/><line x1="821" y1="346" x2="829" y2="346" stroke="#222" stroke-width="3"/>
<text x="825" y="377" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">GND</text>
