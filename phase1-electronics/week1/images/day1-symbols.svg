<g transform="translate(135,320) rotate(0)"><line x1="-40" y1="0" x2="-17" y2="0" stroke="#222" stroke-width="3"/><circle r="17" fill="#fff" stroke="#222" stroke-width="3"/><line x1="17" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/></g><text x="135" y="327" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">A</text>
