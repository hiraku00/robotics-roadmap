<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="960" height="470" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="480.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">問1：電池の「何 C か」と「何分もつか」は別の質問</text>
<rect x="30" y="70" width="250" height="370" rx="10" fill="#fff8e1" stroke="#d4a017" stroke-width="2"/>
<text x="155" y="100" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">1500mAh の電池</text>
<rect x="85" y="120" width="140" height="200" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<rect x="87" y="140" width="136" height="178" fill="#90caf9"/>
<text x="155" y="225" font-size="22" fill="#1565c0" text-anchor="middle" font-weight="bold">1.5Ah</text>
<text x="155" y="250" font-size="13" fill="#1565c0" text-anchor="middle">（たまっている量）</text>
<text x="155" y="355" font-size="15" fill="#222" text-anchor="middle">1.5A なら</text>
<text x="155" y="378" font-size="15" fill="#222" text-anchor="middle">ちょうど1時間で空</text>
<text x="155" y="408" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">この 1.5A を「1C」と呼ぶ</text>
<text x="310" y="110" font-size="15" fill="#777" text-anchor="start">流す電流</text>
<text x="560" y="110" font-size="15" fill="#777" text-anchor="start">空になるまでの時間（バーの長さ）</text>
<polygon points="310,156 450,156 450,148 470,160 450,172 450,164 310,164" fill="#1565c0"/>
<text x="310" y="145" font-size="16" fill="#1565c0" text-anchor="start" font-weight="bold">1.5A ＝ 1C</text>
<rect x="560" y="146" width="360" height="28" fill="#90caf9"/>
<text x="740" y="166" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">60分</text>
<polygon points="310,238 440,238 440,226 476,250 440,274 440,262 310,262" fill="#c62828"/>
<text x="310" y="215" font-size="16" fill="#c62828" text-anchor="start" font-weight="bold">30A ＝ 20C（1.5A の20倍）</text>
<rect x="560" y="236" width="18" height="28" fill="#ef9a9a"/>
<text x="588" y="256" font-size="16" fill="#222" text-anchor="start" font-weight="bold">3分（60分 ÷ 20）</text>
<rect x="310" y="300" width="300" height="140" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="460" y="328" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">① 何 C の電池が必要か</text>
<text x="460" y="362" font-size="15" fill="#222" text-anchor="middle">必要な C ＝ 電流 ÷ 1C</text>
<text x="460" y="392" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">30A ÷ 1.5A ＝ 20C 以上</text>
<text x="460" y="422" font-size="14" fill="#777" text-anchor="middle">→ 電池の「選び方」</text>
<rect x="630" y="300" width="300" height="140" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="780" y="328" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">② 何分もつか</text>
<text x="780" y="362" font-size="15" fill="#222" text-anchor="middle">時間 ＝ 容量 ÷ 電流</text>
<text x="780" y="392" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">1.5Ah ÷ 30A ＝ 0.05時間 ＝ 3分</text>
<text x="780" y="422" font-size="14" fill="#777" text-anchor="middle">→ 動かせる「時間」</text>
</svg>