<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="960" height="500" fill="#fff"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker></defs>
<text x="480.0" y="38" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">マイコンの「入力ピン」：電圧を見て HIGH か LOW かを決めるだけのピン</text>
<rect x="40" y="80" width="250" height="330" rx="14" fill="#1f5f99" stroke="#174a78" stroke-width="3"/>
<text x="165" y="115" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">Arduino</text>
<text x="165" y="140" font-size="14" fill="#dbe8f5" text-anchor="middle">（中のマイコン）</text>
<rect x="270" y="185" width="40" height="22" fill="#333"/>
<text x="255" y="201" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">2番ピン</text>
<rect x="60" y="165" width="120" height="62" rx="8" fill="#e8f0fb"/>
<text x="120" y="190" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">入力ピン</text>
<text x="120" y="214" font-size="13" fill="#222" text-anchor="middle">電圧を「見る」だけ</text>
<path d="M310,196 L400,196" stroke="#222" stroke-width="3" fill="none"/>
<g transform="translate(440,196) rotate(0)"><line x1="-40" y1="0" x2="-16" y2="0" stroke="#222" stroke-width="3"/><circle cx="-16" cy="0" r="3.5" fill="#222"/><circle cx="18" cy="0" r="3.5" fill="#222"/><line x1="-16" y1="0" x2="14" y2="-18" stroke="#222" stroke-width="3"/><line x1="18" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/></g>
<path d="M480,196 L520,196" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="526" cy="196" r="6" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="526" y="178" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">5V</text>
<text x="440" y="230" font-size="14" fill="#222" text-anchor="middle">ボタン</text>
<rect x="270" y="320" width="40" height="22" fill="#333"/>
<text x="255" y="336" font-size="14" fill="#fff" text-anchor="end" font-weight="bold">13番ピン</text>
<rect x="60" y="300" width="120" height="62" rx="8" fill="#fbeee6"/>
<text x="120" y="325" font-size="16" fill="#e65100" text-anchor="middle" font-weight="bold">出力ピン</text>
<text x="120" y="349" font-size="13" fill="#222" text-anchor="middle">電圧を「出す」</text>
<path d="M310,331 L360,331" stroke="#222" stroke-width="3" fill="none"/>
<g transform="translate(400,331) rotate(0)"><line x1="-40" y1="0" x2="-25" y2="0" stroke="#222" stroke-width="3"/><rect x="-25" y="-9" width="50" height="18" fill="#fff" stroke="#222" stroke-width="3"/><line x1="25" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/></g>
<path d="M440,331 L470,331" stroke="#222" stroke-width="3" fill="none"/>
<text x="400" y="365" font-size="13" fill="#555" text-anchor="middle">例：トランジスタのベースへ（17日目の形）</text>
<text x="175" y="440" font-size="12.5" fill="#222" text-anchor="middle">同じピンを、プログラムで入力にも出力にもできる</text>
<text x="175" y="462" font-size="13" fill="#555" text-anchor="middle">（pinMode(2, INPUT) ／ pinMode(13, OUTPUT)）</text>
<rect x="640" y="80.0" width="60" height="132.0" fill="#c8e6c9" stroke="#2e7d32"/>
<rect x="640" y="212.0" width="60" height="99.0" fill="#eeeeee" stroke="#999"/>
<rect x="640" y="311.0" width="60" height="99.0" fill="#bbdefb" stroke="#1565c0"/>
<text x="632" y="85.0" font-size="14" fill="#222" text-anchor="end">5V</text>
<text x="632" y="217.0" font-size="14" fill="#222" text-anchor="end">3V</text>
<text x="632" y="316.0" font-size="14" fill="#222" text-anchor="end">1.5V</text>
<text x="632" y="415.0" font-size="14" fill="#222" text-anchor="end">0V</text>
<text x="670" y="152.0" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">HIGH</text>
<text x="670" y="259.5" font-size="13" fill="#555" text-anchor="middle">どちらか</text>
<text x="670" y="277.5" font-size="13" fill="#555" text-anchor="middle">決まらない</text>
<text x="670" y="366.5" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">LOW</text>
<text x="670" y="68" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">入力ピンの読み方（5V の Arduino）</text>
<line x1="702" y1="80.0" x2="720" y2="80.0" stroke="#2e7d32" stroke-width="3"/>
<text x="726" y="85.0" font-size="13.5" fill="#2e7d32" text-anchor="start">押したとき 5.00V → HIGH</text>
<line x1="702" y1="410.0" x2="720" y2="410.0" stroke="#1565c0" stroke-width="3"/>
<text x="726" y="415.0" font-size="13.5" fill="#1565c0" text-anchor="start">プルダウンで離す 0.00V → LOW</text>
<path d="M710,406.7 C750,344.0 720,245.0 760,172.39999999999998" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="772" y="258.20000000000005" font-size="13.5" fill="#c62828" text-anchor="start" font-weight="bold">抵抗なしで離す</text>
<text x="772" y="276.20000000000005" font-size="13.5" fill="#c62828" text-anchor="start">Tinkercad は 49.5mV</text>
<text x="772" y="294.20000000000005" font-size="13.5" fill="#c62828" text-anchor="start">実物はノイズで</text>
<text x="772" y="312.20000000000005" font-size="13.5" fill="#c62828" text-anchor="start">上下にふらふら</text>
</svg>