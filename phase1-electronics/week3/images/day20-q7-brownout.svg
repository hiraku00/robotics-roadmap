<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="960" height="480" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="480.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">問7：電流が増えるほど端子電圧が下がり、6V を切るとリセット</text>
<path d="M100,400 L573.8,400" stroke="#222" stroke-width="2" fill="none"/>
<path d="M100,400 L100,80.00000000000006" stroke="#222" stroke-width="2" fill="none"/>
<path d="M100,400 L100,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="100" y="426" font-size="13" fill="#222" text-anchor="middle">0</text>
<path d="M146,400 L146,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="146" y="426" font-size="13" fill="#222" text-anchor="middle">1</text>
<path d="M192,400 L192,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="192" y="426" font-size="13" fill="#222" text-anchor="middle">2</text>
<path d="M238,400 L238,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="238" y="426" font-size="13" fill="#222" text-anchor="middle">3</text>
<path d="M284,400 L284,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="284" y="426" font-size="13" fill="#222" text-anchor="middle">4</text>
<path d="M330,400 L330,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="330" y="426" font-size="13" fill="#222" text-anchor="middle">5</text>
<path d="M376,400 L376,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="376" y="426" font-size="13" fill="#222" text-anchor="middle">6</text>
<path d="M422,400 L422,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="422" y="426" font-size="13" fill="#222" text-anchor="middle">7</text>
<path d="M468,400 L468,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="468" y="426" font-size="13" fill="#222" text-anchor="middle">8</text>
<path d="M514,400 L514,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="514" y="426" font-size="13" fill="#222" text-anchor="middle">9</text>
<path d="M560,400 L560,406" stroke="#222" stroke-width="2" fill="none"/>
<text x="560" y="426" font-size="13" fill="#222" text-anchor="middle">10</text>
<path d="M94,400 L100,400" stroke="#222" stroke-width="2" fill="none"/>
<text x="88" y="405" font-size="13" fill="#222" text-anchor="end">5V</text>
<path d="M94,300 L100,300" stroke="#222" stroke-width="2" fill="none"/>
<text x="88" y="305" font-size="13" fill="#222" text-anchor="end">6V</text>
<path d="M94,200 L100,200" stroke="#222" stroke-width="2" fill="none"/>
<text x="88" y="205" font-size="13" fill="#222" text-anchor="end">7V</text>
<path d="M94,100 L100,100" stroke="#222" stroke-width="2" fill="none"/>
<text x="88" y="105" font-size="13" fill="#222" text-anchor="end">8V</text>
<text x="330" y="454" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">流れる電流（A）</text>
<text x="100" y="68.00000000000006" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">端子電圧</text>
<rect x="100" y="300" width="473.79999999999995" height="100" fill="#ffebee"/>
<path d="M100,400 L573.8,400" stroke="#222" stroke-width="2" fill="none"/>
<text x="112" y="386" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">6V より下 ＝ マイコンがリセットする範囲</text>
<path d="M100,300 L573.8,300" stroke="#c62828" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<path d="M100,159.99999999999997 L560,359.99999999999994" stroke="#1565c0" stroke-width="4" fill="none"/>
<circle cx="100" cy="159.99999999999997" r="6" fill="#1565c0"/>
<text x="112" y="149.99999999999997" font-size="14" fill="#1565c0" text-anchor="start" font-weight="bold">0A のとき 7.4V（起電力）</text>
<path d="M422,300 L422,400" stroke="#c62828" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
<circle cx="422" cy="300" r="7" fill="#c62828"/>
<text x="432" y="286" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">7A でちょうど 6V</text>
<rect x="620" y="80" width="310" height="330" rx="10" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<text x="775" y="110" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">解き方</text>
<text x="640" y="145" font-size="15" fill="#222" text-anchor="start">端子電圧 V ＝ E − I × r</text>
<text x="640" y="180" font-size="16" fill="#222" text-anchor="start" font-weight="bold">6 ＝ 7.4 − I × 0.2</text>
<text x="640" y="212" font-size="16" fill="#222" text-anchor="start" font-weight="bold">I × 0.2 ＝ 7.4 − 6 ＝ 1.4</text>
<text x="640" y="244" font-size="18" fill="#c62828" text-anchor="start" font-weight="bold">I ＝ 1.4 ÷ 0.2 ＝ 7A</text>
<text x="640" y="290" font-size="14" fill="#777" text-anchor="start">意味：電池の中の 0.2Ω で</text>
<text x="640" y="312" font-size="14" fill="#777" text-anchor="start">1.4V 消えると、外は 6V になる</text>
<text x="640" y="350" font-size="14" fill="#777" text-anchor="start">1A ふえるごとに</text>
<text x="640" y="372" font-size="14" fill="#777" text-anchor="start">0.2V ずつ下がる（青い線の傾き）</text>
</svg>