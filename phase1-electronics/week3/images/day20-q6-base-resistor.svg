<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="960" height="560" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="480.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">問6：ベース抵抗は「欲しい電流」から逆算する</text>
<rect x="30" y="230" width="110" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="85" y="258" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">Arduino</text>
<text x="85" y="282" font-size="15" fill="#1565c0" text-anchor="middle">ピン 5V</text>
<path d="M140,265 L180,265" stroke="#222" stroke-width="3" fill="none"/>
<line x1="180" y1="265" x2="195" y2="265" stroke="#222" stroke-width="3"/><rect x="195" y="256" width="50" height="18" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="245" y1="265" x2="260" y2="265" stroke="#222" stroke-width="3"/>
<text x="220" y="245" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">Rb ＝ ?</text>
<path d="M260,265 L300,265" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="352" cy="265" r="34" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="300" y1="265" x2="340" y2="265" stroke="#222" stroke-width="3"/><line x1="340" y1="245" x2="340" y2="285" stroke="#222" stroke-width="5"/>
<path d="M340,257 L370,237 L370,215" stroke="#222" stroke-width="3" fill="none"/>
<path d="M340,273 L370,293 L370,315" stroke="#222" stroke-width="3" fill="none"/>
<path d="M370,293 L357,291 L363,282 z" fill="#222"/>
<text x="326" y="318" font-size="13" fill="#777" text-anchor="end">hFE 100</text>
<path d="M370,215 L370,190" stroke="#222" stroke-width="3" fill="none"/>
<rect x="330" y="130" width="80" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="370" y="157" font-size="15" fill="#e65100" text-anchor="middle" font-weight="bold">部品</text>
<text x="370" y="178" font-size="14" fill="#e65100" text-anchor="middle">50mA</text>
<path d="M370,130 L370,100" stroke="#222" stroke-width="3" fill="none"/>
<text x="370" y="92" font-size="14" fill="#222" text-anchor="middle">部品の電源 +</text>
<path d="M370,315 L370,350" stroke="#222" stroke-width="3" fill="none"/>
<line x1="354" y1="350" x2="386" y2="350" stroke="#222" stroke-width="3"/><line x1="360" y1="356" x2="380" y2="356" stroke="#222" stroke-width="3"/><line x1="366" y1="362" x2="374" y2="362" stroke="#222" stroke-width="3"/>
<text x="370" y="385" font-size="13" fill="#777" text-anchor="middle">GND（Arduino と共通）</text>
<line x1="160" y1="290" x2="290" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>
<text x="225" y="312" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">IB ＝ 5mA</text>
<line x1="392" y1="200" x2="392" y2="228" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<text x="400" y="222" font-size="14" fill="#e65100" text-anchor="start" font-weight="bold">IC ＝ 50mA</text>
<text x="270" y="345" font-size="13" fill="#777" text-anchor="middle">B–E 間 0.7V</text>
<rect x="500" y="80" width="430" height="54" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<text x="520" y="114" font-size="20" fill="#c62828" text-anchor="start" font-weight="bold">①</text>
<text x="550" y="103" font-size="14" fill="#777" text-anchor="start">最低限のベース電流</text>
<text x="550" y="124" font-size="16" fill="#222" text-anchor="start" font-weight="bold">IB ＝ IC ÷ hFE ＝ 50mA ÷ 100 ＝ 0.5mA</text>
<rect x="500" y="142" width="430" height="54" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<text x="520" y="176" font-size="20" fill="#c62828" text-anchor="start" font-weight="bold">②</text>
<text x="550" y="165" font-size="14" fill="#777" text-anchor="start">10倍の余裕（確実に ON）</text>
<text x="550" y="186" font-size="16" fill="#222" text-anchor="start" font-weight="bold">0.5mA × 10 ＝ 5mA</text>
<rect x="500" y="204" width="430" height="54" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<text x="520" y="238" font-size="20" fill="#c62828" text-anchor="start" font-weight="bold">③</text>
<text x="550" y="227" font-size="14" fill="#777" text-anchor="start">抵抗にかかる電圧</text>
<text x="550" y="248" font-size="16" fill="#222" text-anchor="start" font-weight="bold">5V − 0.7V ＝ 4.3V</text>
<rect x="500" y="266" width="430" height="54" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<text x="520" y="300" font-size="20" fill="#c62828" text-anchor="start" font-weight="bold">④</text>
<text x="550" y="289" font-size="14" fill="#777" text-anchor="start">オームの法則</text>
<text x="550" y="310" font-size="16" fill="#222" text-anchor="start" font-weight="bold">R ＝ 4.3V ÷ 0.005A ＝ 860Ω</text>
<rect x="500" y="328" width="430" height="54" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
<text x="520" y="362" font-size="20" fill="#c62828" text-anchor="start" font-weight="bold">⑤</text>
<text x="550" y="351" font-size="14" fill="#777" text-anchor="start">売っている値を選ぶ</text>
<text x="550" y="372" font-size="16" fill="#222" text-anchor="start" font-weight="bold">820Ω（4.3 ÷ 820 ＝ 5.2mA）</text>
<text x="250" y="422" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">売っている抵抗の値（E12 系列）</text>
<path d="M60,470 L440,470" stroke="#222" stroke-width="2" fill="none"/>
<path d="M80,460 L80,480" stroke="#222" stroke-width="2" fill="none"/>
<text x="80" y="502" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">680</text>
<path d="M200,460 L200,480" stroke="#222" stroke-width="2" fill="none"/>
<text x="200" y="502" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">820</text>
<path d="M380,460 L380,480" stroke="#222" stroke-width="2" fill="none"/>
<text x="380" y="502" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">1k</text>
<circle cx="240.0" cy="470" r="7" fill="#c62828"/>
<text x="244.0" y="502" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold">860</text>
<line x1="238.0" y1="448" x2="206" y2="448" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<text x="244.0" y="454" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">すぐ下の 820 に切り下げ</text>
<rect x="500" y="400" width="430" height="140" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="715" y="428" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">なぜ #5 と逆に「小さい側」を選ぶのか</text>
<text x="715" y="458" font-size="14" fill="#2e7d32" text-anchor="middle">ベース電流が多い → ON がより確実（困らない）</text>
<text x="715" y="484" font-size="14" fill="#c62828" text-anchor="middle">ベース電流が少ない → ON しきれず熱くなる（困る）</text>
<text x="715" y="516" font-size="14" fill="#777" text-anchor="middle">1kΩ（4.3mA、約8.6倍）でも実際は動く</text>
</svg>