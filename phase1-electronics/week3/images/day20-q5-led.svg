<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="960" height="470" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="480.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">問5：LED の抵抗は、計算した値より「大きい側」の売っている値を選ぶ</text>
<path d="M110,160 L110,100 L300,100 L300,130" stroke="#222" stroke-width="3" fill="none"/>
<line x1="110" y1="160" x2="110" y2="194" stroke="#222" stroke-width="3"/><line x1="90" y1="194" x2="130" y2="194" stroke="#222" stroke-width="3"/><line x1="100" y1="206" x2="120" y2="206" stroke="#222" stroke-width="6"/><line x1="110" y1="206" x2="110" y2="240" stroke="#222" stroke-width="3"/>
<text x="126" y="188" font-size="14" fill="#777" text-anchor="start">+</text>
<text x="126" y="222" font-size="14" fill="#777" text-anchor="start">−</text>
<text x="82" y="205" font-size="18" fill="#222" text-anchor="end" font-weight="bold">9V</text>
<line x1="300" y1="130" x2="300" y2="145" stroke="#222" stroke-width="3"/><rect x="291" y="145" width="18" height="50" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="300" y1="195" x2="300" y2="210" stroke="#222" stroke-width="3"/>
<text x="320" y="175" font-size="16" fill="#222" text-anchor="start" font-weight="bold">R ＝ ?</text>
<path d="M300,210 L300,240" stroke="#222" stroke-width="3" fill="none"/>
<line x1="300" y1="240" x2="300" y2="268" stroke="#222" stroke-width="3"/><path d="M286,268 L314,268 L300,292 z" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/><line x1="286" y1="292" x2="314" y2="292" stroke="#c62828" stroke-width="3"/><line x1="300" y1="292" x2="300" y2="320" stroke="#222" stroke-width="3"/>
<line x1="318" y1="276" x2="334" y2="264" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<line x1="318" y1="288" x2="334" y2="276" stroke="#e65100" stroke-width="2" marker-end="url(#ao)"/>
<text x="344" y="290" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">赤 LED</text>
<path d="M300,320 L300,360 L110,360 L110,240" stroke="#222" stroke-width="3" fill="none"/>
<line x1="160" y1="88" x2="240" y2="88" stroke="#1565c0" stroke-width="3" marker-end="url(#ab)"/>
<text x="200" y="75" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">15mA</text>
<path d="M395,130 L405,130 L405,210 L395,210" stroke="#1565c0" stroke-width="2" fill="none"/>
<text x="415" y="177" font-size="17" fill="#1565c0" text-anchor="start" font-weight="bold">7V</text>
<path d="M395,245 L405,245 L405,318 L395,318" stroke="#1565c0" stroke-width="2" fill="none"/>
<text x="415" y="288" font-size="17" fill="#1565c0" text-anchor="start" font-weight="bold">2V</text>
<rect x="40" y="390" width="400" height="64" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="240" y="416" font-size="15" fill="#222" text-anchor="middle">抵抗の電圧 ＝ 9 − 2 ＝ 7V</text>
<text x="240" y="442" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">R ＝ 7 ÷ 0.015 ＝ 466.67Ω</text>
<text x="700" y="110" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">売っている抵抗の値（E12 系列）</text>
<path d="M500,200 L910,200" stroke="#222" stroke-width="2" fill="none"/>
<path d="M520,190 L520,210" stroke="#222" stroke-width="2" fill="none"/>
<text x="520" y="234" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">330</text>
<path d="M640,190 L640,210" stroke="#222" stroke-width="2" fill="none"/>
<text x="640" y="234" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">390</text>
<path d="M800,190 L800,210" stroke="#222" stroke-width="2" fill="none"/>
<text x="800" y="234" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">470</text>
<path d="M900,190 L900,210" stroke="#222" stroke-width="2" fill="none"/>
<text x="900" y="234" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">560</text>
<circle cx="793.34" cy="200" r="7" fill="#c62828"/>
<text x="779.34" y="184" font-size="15" fill="#c62828" text-anchor="end" font-weight="bold">466.67</text>
<text x="800" y="148" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">すぐ上の 470 に切り上げ</text>
<line x1="800" y1="156" x2="800" y2="186" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<rect x="480" y="270" width="450" height="184" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="705" y="300" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">470Ω を選ぶと：7 ÷ 470 ＝ 14.9mA</text>
<text x="705" y="328" font-size="14" fill="#2e7d32" text-anchor="middle">15mA より少し少ない → LED にやさしい（安全側）</text>
<text x="705" y="366" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">390Ω を選ぶと：7 ÷ 390 ＝ 17.9mA</text>
<text x="705" y="394" font-size="14" fill="#c62828" text-anchor="middle">15mA より多い → LED に負担（危険側）</text>
<text x="705" y="432" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">電流が多すぎると困る部品 → 抵抗は大きい側を選ぶ</text>
</svg>