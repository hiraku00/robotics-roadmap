<path d="M770,118 L770,130" stroke="#222" stroke-width="3" fill="none"/>
<g transform="translate(770,170) rotate(90)"><line x1="-40" y1="0" x2="-16" y2="0" stroke="#222" stroke-width="3"/><circle cx="-16" cy="0" r="3.5" fill="#222"/><circle cx="18" cy="0" r="3.5" fill="#222"/><line x1="-16" y1="0" x2="14" y2="-18" stroke="#222" stroke-width="3"/><line x1="18" y1="0" x2="40" y2="0" stroke="#222" stroke-width="3"/></g>
<text x="792" y="176" font-size="15" fill="#222" text-anchor="start">ボタン</text>
<path d="M770,210 L770,250" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="770" cy="250" r="5" fill="#222"/>
<path d="M770,250 L890,250" stroke="#222" stroke-width="3" fill="none"/>
