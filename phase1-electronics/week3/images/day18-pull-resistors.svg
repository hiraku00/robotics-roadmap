<text x="896" y="232" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">入力点</text>
<text x="896" y="276" font-size="12" fill="#555" text-anchor="middle">（Arduino へ）</text>
<text x="770" y="320" font-size="40" fill="#c62828" text-anchor="middle" font-weight="bold">？</text>
<text x="770" y="350" font-size="13" fill="#c62828" text-anchor="middle">GND にも</text>
<text x="770" y="368" font-size="13" fill="#c62828" text-anchor="middle">つながっていない</text>
