<line x1="450" y1="385" x2="450" y2="397" stroke="#222" stroke-width="3"/><line x1="434" y1="397" x2="466" y2="397" stroke="#222" stroke-width="3"/><line x1="440" y1="404" x2="460" y2="404" stroke="#222" stroke-width="3"/><line x1="446" y1="411" x2="454" y2="411" stroke="#222" stroke-width="3"/>
<line x1="355" y1="430" x2="615" y2="430" stroke="#ddd"/>
<text x="365" y="460" font-size="15" fill="#222" text-anchor="start" font-weight="bold">離す</text>
<text x="420" y="460" font-size="15" fill="#1565c0" text-anchor="start" font-weight="bold">5V（HIGH）</text>
<text x="365" y="490" font-size="15" fill="#222" text-anchor="start" font-weight="bold">押す</text>
<text x="420" y="490" font-size="15" fill="#222" text-anchor="start">0V（LOW）</text>
<text x="485" y="522" font-size="12.5" fill="#555" text-anchor="middle">抵抗が入力点を 5V へ「引き上げる」</text>
<rect x="660" y="60" width="290" height="480" rx="10" fill="#fafbfd" stroke="#c62828" stroke-width="2"/>
<text x="805" y="88" font-size="17" fill="#c62828" text-anchor="middle" font-weight="bold">抵抗なし（18日目の実験）</text>
<circle cx="770" cy="112" r="6" fill="#fff" stroke="#222" stroke-width="3"/>
