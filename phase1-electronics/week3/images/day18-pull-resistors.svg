<text x="740" y="460" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">決まらない（49.5mV）</text>
<text x="685" y="490" font-size="15" fill="#222" text-anchor="start" font-weight="bold">押す</text>
<text x="740" y="490" font-size="15" fill="#222" text-anchor="start">5V（HIGH）</text>
<text x="805" y="522" font-size="12.5" fill="#555" text-anchor="middle">離すと入力点がどこにもつながらない</text>
