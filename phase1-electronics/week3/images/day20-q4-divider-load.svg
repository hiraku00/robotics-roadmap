<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="960" height="500" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
</defs>
<text x="480.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">問4：分圧回路に負荷をつなぐと、出力の電圧が下がる</text>
<path d="M90,170 L90,100 L250,100 L250,120" stroke="#222" stroke-width="3" fill="none"/>
<line x1="90" y1="170" x2="90" y2="204" stroke="#222" stroke-width="3"/><line x1="70" y1="204" x2="110" y2="204" stroke="#222" stroke-width="3"/><line x1="80" y1="216" x2="100" y2="216" stroke="#222" stroke-width="6"/><line x1="90" y1="216" x2="90" y2="250" stroke="#222" stroke-width="3"/>
<text x="106" y="198" font-size="14" fill="#777" text-anchor="start">+</text>
<text x="106" y="232" font-size="14" fill="#777" text-anchor="start">−</text>
<text x="62" y="215" font-size="18" fill="#222" text-anchor="end" font-weight="bold">9V</text>
<line x1="250" y1="120" x2="250" y2="135" stroke="#222" stroke-width="3"/><rect x="241" y="135" width="18" height="50" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="250" y1="185" x2="250" y2="200" stroke="#222" stroke-width="3"/>
<text x="232" y="165" font-size="15" fill="#222" text-anchor="end" font-weight="bold">R1 2kΩ</text>
<path d="M250,200 L250,240" stroke="#222" stroke-width="3" fill="none"/>
<line x1="250" y1="240" x2="250" y2="255" stroke="#222" stroke-width="3"/><rect x="241" y="255" width="18" height="50" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="250" y1="305" x2="250" y2="320" stroke="#222" stroke-width="3"/>
<text x="232" y="285" font-size="15" fill="#222" text-anchor="end" font-weight="bold">R2 1kΩ</text>
<path d="M250,320 L250,350 L90,350 L90,250" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="250" cy="220" r="5" fill="#c62828"/>
<text x="264" y="212" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">出力 3V</text>
<path d="M560,170 L560,100 L720,100 L720,120" stroke="#222" stroke-width="3" fill="none"/>
<line x1="560" y1="170" x2="560" y2="204" stroke="#222" stroke-width="3"/><line x1="540" y1="204" x2="580" y2="204" stroke="#222" stroke-width="3"/><line x1="550" y1="216" x2="570" y2="216" stroke="#222" stroke-width="6"/><line x1="560" y1="216" x2="560" y2="250" stroke="#222" stroke-width="3"/>
<text x="576" y="198" font-size="14" fill="#777" text-anchor="start">+</text>
<text x="576" y="232" font-size="14" fill="#777" text-anchor="start">−</text>
<text x="532" y="215" font-size="18" fill="#222" text-anchor="end" font-weight="bold">9V</text>
<line x1="720" y1="120" x2="720" y2="135" stroke="#222" stroke-width="3"/><rect x="711" y="135" width="18" height="50" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="720" y1="185" x2="720" y2="200" stroke="#222" stroke-width="3"/>
<text x="702" y="165" font-size="15" fill="#222" text-anchor="end" font-weight="bold">R1 2kΩ</text>
<path d="M720,200 L720,240" stroke="#222" stroke-width="3" fill="none"/>
<line x1="720" y1="240" x2="720" y2="255" stroke="#222" stroke-width="3"/><rect x="711" y="255" width="18" height="50" fill="#fff" stroke="#c62828" stroke-width="3"/><line x1="720" y1="305" x2="720" y2="320" stroke="#222" stroke-width="3"/>
<text x="702" y="285" font-size="15" fill="#222" text-anchor="end" font-weight="bold">R2 1kΩ</text>
<path d="M720,320 L720,350 L560,350 L560,250" stroke="#222" stroke-width="3" fill="none"/>
<circle cx="720" cy="220" r="5" fill="#c62828"/>
<path d="M720,220 L830,220 L830,240" stroke="#222" stroke-width="3" fill="none"/>
<path d="M720,350 L830,350 L830,320" stroke="#222" stroke-width="3" fill="none"/>
<line x1="830" y1="240" x2="830" y2="255" stroke="#222" stroke-width="3"/><rect x="821" y="255" width="18" height="50" fill="#fff" stroke="#e65100" stroke-width="3"/><line x1="830" y1="305" x2="830" y2="320" stroke="#222" stroke-width="3"/>
<text x="848" y="285" font-size="15" fill="#e65100" text-anchor="start" font-weight="bold">負荷 1kΩ</text>
<circle cx="720" cy="350" r="5" fill="#222"/>
<text x="734" y="212" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">出力 1.8V</text>
<text x="245" y="80" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">負荷なし</text>
<text x="715" y="80" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">負荷 1kΩ をつないだ</text>
<rect x="40" y="380" width="410" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="245" y="410" font-size="15" fill="#222" text-anchor="middle">出力 ＝ 9 × R2 ÷ (R1 + R2)</text>
<text x="245" y="440" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">＝ 9 × 1 ÷ (2 + 1) ＝ 3V</text>
<text x="245" y="466" font-size="14" fill="#777" text-anchor="middle">R2 の取り分は全体の 1/3</text>
<rect x="480" y="380" width="450" height="100" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="705" y="408" font-size="15" fill="#222" text-anchor="middle">① R2 と負荷は並列：1×1 ÷ (1+1) ＝ 0.5kΩ</text>
<text x="705" y="436" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">② 9 × 0.5 ÷ (2 + 0.5) ＝ 1.8V</text>
<text x="705" y="464" font-size="14" fill="#777" text-anchor="middle">下の抵抗が小さくなった分、取り分が減る（3V → 1.8V）</text>
</svg>