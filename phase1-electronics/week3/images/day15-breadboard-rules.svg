<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1090" width="980" height="1090" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="1090" fill="#fff"/>
<text x="490" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#222">ブレッドボードの正しい組み方と、よくある間違い</text>
<rect x="40" y="60" width="900" height="200" rx="12" fill="#f4f6fb" stroke="#c5cbe0"/>
<text x="60" y="92" font-size="19" font-weight="bold" fill="#222">ルール：同じ行・同じ側の5つの穴は、中でつながった「1本の線（グループ）」</text>
<text x="150" y="125" font-size="15" text-anchor="middle" fill="#555">a</text>
<text x="190" y="125" font-size="15" text-anchor="middle" fill="#555">b</text>
<text x="230" y="125" font-size="15" text-anchor="middle" fill="#555">c</text>
<text x="270" y="125" font-size="15" text-anchor="middle" fill="#555">d</text>
<text x="310" y="125" font-size="15" text-anchor="middle" fill="#555">e</text>
<text x="430" y="125" font-size="15" text-anchor="middle" fill="#555">f</text>
<text x="470" y="125" font-size="15" text-anchor="middle" fill="#555">g</text>
<text x="510" y="125" font-size="15" text-anchor="middle" fill="#555">h</text>
<text x="550" y="125" font-size="15" text-anchor="middle" fill="#555">i</text>
<text x="590" y="125" font-size="15" text-anchor="middle" fill="#555">j</text>
<rect x="355" y="130" width="30" height="85" fill="#ddd"/><text x="370" y="178" font-size="13" text-anchor="middle" fill="#555">溝</text>
<text x="110" y="155" font-size="15" text-anchor="end" fill="#555">1行目</text>
<rect x="135" y="138" width="190" height="24" rx="12" fill="#90caf9"/>
<rect x="415" y="138" width="190" height="24" rx="12" fill="#a5d6a7"/>
<circle cx="150" cy="150" r="6" fill="#333"/><circle cx="430" cy="150" r="6" fill="#333"/>
<circle cx="190" cy="150" r="6" fill="#333"/><circle cx="470" cy="150" r="6" fill="#333"/>
<circle cx="230" cy="150" r="6" fill="#333"/><circle cx="510" cy="150" r="6" fill="#333"/>
<circle cx="270" cy="150" r="6" fill="#333"/><circle cx="550" cy="150" r="6" fill="#333"/>
<circle cx="310" cy="150" r="6" fill="#333"/><circle cx="590" cy="150" r="6" fill="#333"/>
<text x="110" y="200" font-size="15" text-anchor="end" fill="#555">2行目</text>
<rect x="135" y="183" width="190" height="24" rx="12" fill="#ffe0b2"/>
<rect x="415" y="183" width="190" height="24" rx="12" fill="#f8bbd0"/>
<circle cx="150" cy="195" r="6" fill="#333"/><circle cx="430" cy="195" r="6" fill="#333"/>
<circle cx="190" cy="195" r="6" fill="#333"/><circle cx="470" cy="195" r="6" fill="#333"/>
<circle cx="230" cy="195" r="6" fill="#333"/><circle cx="510" cy="195" r="6" fill="#333"/>
<circle cx="270" cy="195" r="6" fill="#333"/><circle cx="550" cy="195" r="6" fill="#333"/>
<circle cx="310" cy="195" r="6" fill="#333"/><circle cx="590" cy="195" r="6" fill="#333"/>
<g font-size="15" fill="#222"><text x="640" y="135">・色が同じ穴どうしはつながっている</text><text x="640" y="160">・溝の左右（a〜e と f〜j）は別</text><text x="640" y="185">・行が違えば別</text><text x="640" y="210">・部品は、違う色をまたいで挿す</text></g>
<text x="60" y="245" font-size="15" fill="#555">（両端の＋レール・−レールは、縦の列全体が1つのグループ）</text>
<rect x="40" y="280" width="430" height="380" rx="12" fill="#eef7ee" stroke="#b9d8b9"/>
<text x="60" y="314" font-size="19" font-weight="bold" fill="#2e7d32">○ 正しい：1本の道になっている</text>
<rect x="190" y="349" width="260" height="22" rx="11" fill="#ffcdd2"/><text x="180" y="365" font-size="14" text-anchor="end" fill="#222">5V（＋レール）</text>
<rect x="190" y="414" width="260" height="22" rx="11" fill="#c8e6c9"/><text x="180" y="430" font-size="14" text-anchor="end" fill="#222">グループ X</text>
<rect x="190" y="479" width="260" height="22" rx="11" fill="#bbdefb"/><text x="180" y="495" font-size="14" text-anchor="end" fill="#222">グループ Y</text>
<rect x="190" y="544" width="260" height="22" rx="11" fill="#cfd8dc"/><text x="180" y="560" font-size="14" text-anchor="end" fill="#222">GND（−レール）</text>
<line x1="270" y1="360" x2="270" y2="425" stroke="#222" stroke-width="3"/><circle cx="270" cy="360" r="5" fill="#222"/><circle cx="270" cy="425" r="5" fill="#222"/>
<rect x="250" y="379.5" width="40" height="26" rx="4" fill="#fbc02d" stroke="#b28704" stroke-width="2"/><text x="270" y="398.5" font-size="15" text-anchor="middle" font-weight="bold">A</text>
<line x1="340" y1="425" x2="340" y2="490" stroke="#222" stroke-width="3"/><circle cx="340" cy="425" r="5" fill="#222"/><circle cx="340" cy="490" r="5" fill="#222"/>
<path d="M328,447.5 L352,447.5 L340,465.5 Z" fill="#e53935"/><line x1="328" y1="466.5" x2="352" y2="466.5" stroke="#e53935" stroke-width="3"/><text x="324" y="462.5" font-size="13" text-anchor="end">LED</text>
<line x1="400" y1="490" x2="400" y2="555" stroke="#222" stroke-width="3"/><circle cx="400" cy="490" r="5" fill="#222"/><circle cx="400" cy="555" r="5" fill="#222"/>
<rect x="392" y="504.5" width="16" height="36" fill="#e9cf9b" stroke="#b8975a" stroke-width="2"/><text x="414" y="527.5" font-size="13">抵抗</text>
<text x="60" y="598" font-size="15" fill="#2e7d32">どの部品も、2本の足が違うグループ。</text>
<text x="60" y="620" font-size="15" fill="#2e7d32">5V → 電流計 → LED → 抵抗 → GND と</text>
<text x="60" y="642" font-size="15" fill="#2e7d32">1本の道でつながる。</text>
<rect x="510" y="280" width="430" height="380" rx="12" fill="#fdeeee" stroke="#e6b4b4"/>
<text x="530" y="314" font-size="19" font-weight="bold" fill="#c62828">× 抵抗の両足が同じグループ</text>
<rect x="660" y="349" width="260" height="22" rx="11" fill="#ffcdd2"/><text x="650" y="365" font-size="14" text-anchor="end" fill="#222">5V（＋レール）</text>
<rect x="660" y="414" width="260" height="22" rx="11" fill="#c8e6c9"/><text x="650" y="430" font-size="14" text-anchor="end" fill="#222">グループ X</text>
<rect x="660" y="479" width="260" height="22" rx="11" fill="#bbdefb"/><text x="650" y="495" font-size="14" text-anchor="end" fill="#222">グループ Y</text>
<rect x="660" y="544" width="260" height="22" rx="11" fill="#cfd8dc"/><text x="650" y="560" font-size="14" text-anchor="end" fill="#222">GND（−レール）</text>
<line x1="740" y1="360" x2="740" y2="425" stroke="#222" stroke-width="3"/><circle cx="740" cy="360" r="5" fill="#222"/><circle cx="740" cy="425" r="5" fill="#222"/>
<rect x="720" y="379.5" width="40" height="26" rx="4" fill="#fbc02d" stroke="#b28704" stroke-width="2"/><text x="740" y="398.5" font-size="15" text-anchor="middle" font-weight="bold">A</text>
<line x1="770" y1="425" x2="770" y2="490" stroke="#222" stroke-width="3"/><circle cx="770" cy="425" r="5" fill="#222"/><circle cx="770" cy="490" r="5" fill="#222"/>
<path d="M758,447.5 L782,447.5 L770,465.5 Z" fill="#e53935"/><line x1="758" y1="466.5" x2="782" y2="466.5" stroke="#e53935" stroke-width="3"/><text x="754" y="462.5" font-size="13" text-anchor="end">LED</text>
<circle cx="810" cy="490" r="5" fill="#222"/><circle cx="860" cy="490" r="5" fill="#222"/>
<line x1="810" y1="490" x2="822" y2="464" stroke="#222" stroke-width="2"/><line x1="860" y1="490" x2="848" y2="464" stroke="#222" stroke-width="2"/><rect x="822" y="456" width="26" height="14" fill="#e9cf9b" stroke="#b8975a"/><text x="835" y="450" font-size="13" text-anchor="middle">抵抗</text>
<line x1="900" y1="490" x2="900" y2="555" stroke="#222" stroke-width="3"/><circle cx="900" cy="490" r="5" fill="#222"/><circle cx="900" cy="555" r="5" fill="#222"/>
<text x="908" y="527.5" font-size="13" fill="#555">線</text>
<text x="530" y="598" font-size="15" fill="#c62828">抵抗の両足が同じ線につながり、抵抗が</text>
<text x="530" y="620" font-size="15" fill="#c62828">「ただの線」になる。電流を抑えられず、</text>
<text x="530" y="642" font-size="15" fill="#c62828">LED に大きな電流が流れて壊れる。</text>
<rect x="40" y="690" width="430" height="380" rx="12" fill="#fdeeee" stroke="#e6b4b4"/>
<text x="60" y="724" font-size="19" font-weight="bold" fill="#c62828">× 電流計の両端が同じグループ</text>
<rect x="190" y="759" width="260" height="22" rx="11" fill="#ffcdd2"/><text x="180" y="775" font-size="14" text-anchor="end" fill="#222">5V（＋レール）</text>
<rect x="190" y="824" width="260" height="22" rx="11" fill="#c8e6c9"/><text x="180" y="840" font-size="14" text-anchor="end" fill="#222">グループ X</text>
<rect x="190" y="889" width="260" height="22" rx="11" fill="#bbdefb"/><text x="180" y="905" font-size="14" text-anchor="end" fill="#222">グループ Y</text>
<rect x="190" y="954" width="260" height="22" rx="11" fill="#cfd8dc"/><text x="180" y="970" font-size="14" text-anchor="end" fill="#222">GND（−レール）</text>
<line x1="230" y1="770" x2="230" y2="835" stroke="#222" stroke-width="3"/><circle cx="230" cy="770" r="5" fill="#222"/><circle cx="230" cy="835" r="5" fill="#222"/>
<text x="238" y="807.5" font-size="13" fill="#555">線</text>
<circle cx="270" cy="835" r="5" fill="#222"/><circle cx="320" cy="835" r="5" fill="#222"/>
<line x1="270" y1="835" x2="282" y2="809" stroke="#555" stroke-width="2"/><line x1="320" y1="835" x2="308" y2="809" stroke="#555" stroke-width="2"/><rect x="275" y="785" width="40" height="24" rx="4" fill="#fbc02d" stroke="#b28704"/><text x="295" y="802" font-size="14" text-anchor="middle" font-weight="bold">A</text>
<line x1="380" y1="835" x2="380" y2="900" stroke="#222" stroke-width="3"/><circle cx="380" cy="835" r="5" fill="#222"/><circle cx="380" cy="900" r="5" fill="#222"/>
<path d="M368,857.5 L392,857.5 L380,875.5 Z" fill="#e53935"/><line x1="368" y1="876.5" x2="392" y2="876.5" stroke="#e53935" stroke-width="3"/><text x="364" y="872.5" font-size="13" text-anchor="end">LED</text>
<line x1="430" y1="900" x2="430" y2="965" stroke="#222" stroke-width="3"/><circle cx="430" cy="900" r="5" fill="#222"/><circle cx="430" cy="965" r="5" fill="#222"/>
<rect x="422" y="914.5" width="16" height="36" fill="#e9cf9b" stroke="#b8975a" stroke-width="2"/><text x="444" y="937.5" font-size="13">抵抗</text>
<text x="60" y="1008" font-size="15" fill="#c62828">電流計の両端が同じ線なので、電流が</text>
<text x="60" y="1030" font-size="15" fill="#c62828">メーターを通らない → 0.00A と表示。</text>
<text x="60" y="1052" font-size="15" fill="#c62828">回路は動いているが、測れていない。</text>
<rect x="510" y="690" width="430" height="380" rx="12" fill="#fdeeee" stroke="#e6b4b4"/>
<text x="530" y="724" font-size="19" font-weight="bold" fill="#c62828">× 電流計が LED の横に並んでいる</text>
<rect x="660" y="759" width="260" height="22" rx="11" fill="#ffcdd2"/><text x="650" y="775" font-size="14" text-anchor="end" fill="#222">5V（＋レール）</text>
<rect x="660" y="824" width="260" height="22" rx="11" fill="#c8e6c9"/><text x="650" y="840" font-size="14" text-anchor="end" fill="#222">グループ X</text>
<rect x="660" y="889" width="260" height="22" rx="11" fill="#bbdefb"/><text x="650" y="905" font-size="14" text-anchor="end" fill="#222">グループ Y</text>
<rect x="660" y="954" width="260" height="22" rx="11" fill="#cfd8dc"/><text x="650" y="970" font-size="14" text-anchor="end" fill="#222">GND（−レール）</text>
<line x1="700" y1="770" x2="700" y2="835" stroke="#222" stroke-width="3"/><circle cx="700" cy="770" r="5" fill="#222"/><circle cx="700" cy="835" r="5" fill="#222"/>
<text x="708" y="807.5" font-size="13" fill="#555">線</text>
<line x1="780" y1="835" x2="780" y2="900" stroke="#222" stroke-width="3"/><circle cx="780" cy="835" r="5" fill="#222"/><circle cx="780" cy="900" r="5" fill="#222"/>
<path d="M768,857.5 L792,857.5 L780,875.5 Z" fill="#e53935"/><line x1="768" y1="876.5" x2="792" y2="876.5" stroke="#e53935" stroke-width="3"/><text x="764" y="872.5" font-size="13" text-anchor="end">LED</text>
<line x1="850" y1="835" x2="850" y2="900" stroke="#222" stroke-width="3"/><circle cx="850" cy="835" r="5" fill="#222"/><circle cx="850" cy="900" r="5" fill="#222"/>
<rect x="830" y="854.5" width="40" height="26" rx="4" fill="#fbc02d" stroke="#b28704" stroke-width="2"/><text x="850" y="873.5" font-size="15" text-anchor="middle" font-weight="bold">A</text>
<line x1="905" y1="900" x2="905" y2="965" stroke="#222" stroke-width="3"/><circle cx="905" cy="900" r="5" fill="#222"/><circle cx="905" cy="965" r="5" fill="#222"/>
<rect x="897" y="914.5" width="16" height="36" fill="#e9cf9b" stroke="#b8975a" stroke-width="2"/><text x="919" y="937.5" font-size="13">抵抗</text>
<text x="530" y="1008" font-size="15" fill="#c62828">電流計（ほぼ0Ω）が LED の迂回路になり、</text>
<text x="530" y="1030" font-size="15" fill="#c62828">電流が全部メーターを通る → LED が消える。</text>
<text x="530" y="1052" font-size="15" fill="#c62828">電流計は「はさむ」もの。「並べる」ものではない。</text>
</svg>