<text x="490" y="492" font-size="13.5" fill="#222" text-anchor="middle">電圧が少しゆれても、しきい値をまたがないかぎり、読む値は変わらない。たとえ：水位の線。水面がゆれても「線より上なら満タン」</text>
<text x="490" y="514" font-size="13.5" fill="#222" text-anchor="middle">もし「ちょうど 5V のときだけ 1」にすると、4.9V でも 0 と読んでしまい、ゆれるたびに 0 と 1 が入れかわってしまう</text>
