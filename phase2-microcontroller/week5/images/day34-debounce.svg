<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="500" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">デバウンス：前回から 50ms 未満の押下は、チャタリングとして無視する</text>
<text x="30" y="140" font-size="14" fill="#222" text-anchor="start" font-weight="bold">ピンの電圧</text>
<text x="102" y="105" font-size="12" fill="#c62828" text-anchor="end" font-weight="bold">高（離している）</text>
<text x="102" y="165" font-size="12" fill="#1565c0" text-anchor="end" font-weight="bold">低（押している）</text>
<path d="M110,100 L250,100 L250,160 L262,160 L262,100 L274,100 L274,160 L286,160 L286,100 L298,100 L298,160 L860,160" fill="none" stroke="#222" stroke-width="3"/>
<text x="274" y="85" font-size="12.5" fill="#222" text-anchor="middle" font-weight="bold">ボタンを押した（バタつく：数ミリ秒）</text>
<path d="M250,175 L250,205" fill="none" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,4"/>
<circle cx="250" cy="215" r="9" fill="#2e7d32" stroke="#222" stroke-width="1.5"/>
<path d="M274,175 L274,205" fill="none" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,4"/>
<circle cx="274" cy="215" r="9" fill="#c62828" stroke="#222" stroke-width="1.5"/>
<path d="M298,175 L298,205" fill="none" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,4"/>
<circle cx="298" cy="215" r="9" fill="#c62828" stroke="#222" stroke-width="1.5"/>
<text x="215" y="245" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">受け入れる</text>
<text x="215" y="263" font-size="11.5" fill="#555" text-anchor="middle">lastPress を更新</text>
<text x="430" y="245" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">無視（2つ）</text>
<text x="430" y="263" font-size="11.5" fill="#555" text-anchor="middle">前回から 50ms 未満</text>
<path d="M290,225 L370,238" fill="none" stroke="#c62828" stroke-width="1.5"/>
<path d="M250,285 L298,285" fill="none" stroke="#c62828" stroke-width="2.5"/>
<path d="M250,278 L250,292" fill="none" stroke="#c62828" stroke-width="2"/>
<path d="M298,278 L298,292" fill="none" stroke="#c62828" stroke-width="2"/>
<text x="274" y="308" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">数ミリ秒（ここは 50ms の中）</text>
<path d="M250,340 L650,340" fill="none" stroke="#1565c0" stroke-width="2.5"/>
<path d="M250,332 L250,348" fill="none" stroke="#1565c0" stroke-width="2"/>
<path d="M650,332 L650,348" fill="none" stroke="#1565c0" stroke-width="2"/>
<text x="450" y="365" font-size="12.5" fill="#1565c0" text-anchor="middle" font-weight="bold">debounceTime ＝ 50ms（この間の押下は、すべて無視）</text>
<rect x="30" y="395" width="920" height="90" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="50" y="422" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">if (now - lastPress &lt; debounceTime) { return; }</text>
<text x="50" y="447" font-size="13" fill="#555" text-anchor="start">now：いまの時刻　／　lastPress：前回、受け入れた時刻　／　debounceTime：50（ミリ秒）</text>
<text x="50" y="470" font-size="13" fill="#555" text-anchor="start">人が2回押す間隔（0.1秒以上）は 50ms より長いので、2回目はちゃんと受け入れられる</text>
</svg>
