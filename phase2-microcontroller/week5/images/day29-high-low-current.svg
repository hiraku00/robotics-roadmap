<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="500" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">HIGH（5V）のときだけ、高さの差ができて電流が流れる</text>
<rect x="30" y="70" width="920" height="170" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="50" y="98" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">HIGH のとき：digitalWrite(9, HIGH)</text>
<rect x="80" y="118" width="90" height="44" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
<text x="125" y="145" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">ピン9</text>
<path d="M170,140 L280,140" fill="none" stroke="#c62828" stroke-width="2.5"/>
<path d="M280,140 L286.7,131 L300.0,149 L313.3,131 L326.7,149 L340.0,131 L353.3,149 L360,140" fill="none" stroke="#c62828" stroke-width="2.5"/>
<path d="M360,140 L480,140" fill="none" stroke="#c62828" stroke-width="2.5"/>
<path d="M480,126 L480,154 L506,140 z" fill="#ef5350" stroke="#222" stroke-width="2"/>
<path d="M506,126 L506,154" fill="none" stroke="#222" stroke-width="2.5"/>
<path d="M492,120 L502,106" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<path d="M504,120 L514,106" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<path d="M506,140 L640,140" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="642" y="118" width="80" height="44" rx="6" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
<text x="682" y="145" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">GND</text>
<text x="320" y="120" font-size="13" fill="#222" text-anchor="middle">220Ω</text>
<text x="493" y="176" font-size="13" fill="#222" text-anchor="middle">LED</text>
<text x="220" y="128" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">5V</text>
<text x="420" y="128" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">約2V</text>
<text x="580" y="128" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">0V</text>
<text x="320" y="176" font-size="13" fill="#1565c0" text-anchor="middle">ここで約3V下がる</text>
<text x="493" y="196" font-size="13" fill="#1565c0" text-anchor="middle">ここで約2V下がる</text>
<text x="750" y="132" font-size="14" fill="#222" text-anchor="start">電流 ＝ 3V ÷ 220Ω</text>
<text x="750" y="154" font-size="14" fill="#222" text-anchor="start">　　 ≒ 0.0136A</text>
<text x="750" y="178" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">　　 ＝ 約 13.6mA</text>
<text x="750" y="200" font-size="12" fill="#777" text-anchor="start">（計算。測ってはいない）</text>
<rect x="30" y="260" width="920" height="170" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="50" y="288" font-size="15" fill="#555" text-anchor="start" font-weight="bold">LOW のとき：digitalWrite(9, LOW)</text>
<rect x="80" y="308" width="90" height="44" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
<text x="125" y="335" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">ピン9</text>
<path d="M170,330 L280,330" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<path d="M280,330 L286.7,321 L300.0,339 L313.3,321 L326.7,339 L340.0,321 L353.3,339 L360,330" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<path d="M360,330 L480,330" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<path d="M480,316 L480,344 L506,330 z" fill="#e0e0e0" stroke="#222" stroke-width="2"/>
<path d="M506,316 L506,344" fill="none" stroke="#222" stroke-width="2.5"/>
<path d="M506,330 L640,330" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<rect x="642" y="308" width="80" height="44" rx="6" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
<text x="682" y="335" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">GND</text>
<text x="320" y="310" font-size="13" fill="#222" text-anchor="middle">220Ω</text>
<text x="493" y="366" font-size="13" fill="#222" text-anchor="middle">LED</text>
<text x="220" y="318" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">0V</text>
<text x="420" y="318" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">0V</text>
<text x="580" y="318" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">0V</text>
<text x="320" y="366" font-size="13" fill="#777" text-anchor="middle">高さの差がない</text>
<text x="750" y="332" font-size="14" fill="#222" text-anchor="start">電流 ＝ 0V ÷ 220Ω</text>
<text x="750" y="356" font-size="15" fill="#555" text-anchor="start" font-weight="bold">　　 ＝ 0mA → 消える</text>
<rect x="30" y="440" width="920" height="44" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="468" font-size="14" fill="#222" text-anchor="middle">たとえ：ピン9は「高さを 5V と 0V に切り替えられる台」。台を上げたときだけ、GND（地面）へ水が流れ落ちる</text>
</svg>
