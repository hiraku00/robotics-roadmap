<text x="490" y="322" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">番号 8 のとき、noteDurations[8] を読む。記事のコードでは、そこには何も決まっていない（配列の外を読む）</text>
<text x="490" y="346" font-size="13" fill="#555" text-anchor="middle">読んだ値が 0 なら、1000 ÷ 0（0 で割る）。大きな値や小さな値なら、次の音までの待ち時間がでたらめになる</text>
<rect x="30" y="372" width="920" height="78" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="400" font-size="14.5" fill="#222" text-anchor="middle" font-weight="bold">直し方：noteDurations にも9個目の数字（4）を足して、melody と同じ個数にする</text>
<text x="490" y="426" font-size="13.5" fill="#222" text-anchor="middle">たとえ：9席あるのに、切符が8枚しかない。9人目の切符（9個目の数字）を足す</text>
