<rect x="828" y="110.0" width="110" height="80" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="883" y="134.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">A0</text>
<text x="883" y="156.0" font-size="15" fill="#e65100" text-anchor="middle" font-weight="bold">5V</text>
<text x="883" y="178.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">画面 1023</text>
<text x="490" y="525" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">A0 の電圧 ＝ 5V × 下の抵抗 ÷（上の抵抗 ＋ 下の抵抗）　　画面の数字 ＝ 電圧 ÷ 5V × 1023</text>
<text x="490" y="550" font-size="12.5" fill="#555" text-anchor="middle">250kΩ は Tinkercad の可変抵抗器の初期値。分圧は抵抗の「比」で決まるので、値が10kΩでも同じ数字になる（計算。電圧は測っていない）</text>
<text x="490" y="574" font-size="12.5" fill="#555" text-anchor="middle">0・511・1023 は、シリアルモニタに出た数字（Tinkercad）。電圧は、その数字から計算した値</text>
</svg>
