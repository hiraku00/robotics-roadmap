<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="560" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">3.1：ボタンを押すと、ピン2の電圧が 0V から 5V に変わる（プルダウン）</text>
<rect x="30" y="60" width="450" height="480" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="255" y="92" font-size="17" fill="#555" text-anchor="middle" font-weight="bold">押していない</text>
<text x="140" y="126" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">5V</text>
<path d="M140,134 L140,180" fill="none" stroke="#c62828" stroke-width="3"/>
<circle cx="140" cy="180" r="4" fill="#222" stroke="#222" stroke-width="2"/>
<circle cx="140" cy="250" r="4" fill="#222" stroke="#222" stroke-width="2"/>
<path d="M140,180 L166,218" fill="none" stroke="#222" stroke-width="3"/>
<path d="M140,250 L140,300" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<text x="124" y="220" font-size="13" fill="#222" text-anchor="end" font-weight="bold">ボタン</text>
<circle cx="140" cy="300" r="5" fill="#222" stroke="#222" stroke-width="2"/>
<path d="M140,300 L300,300" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#ab)"/>
<rect x="302" y="272" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
<text x="377" y="296" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">ピン2</text>
<text x="377" y="316" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">0V</text>
<path d="M140,300 L140,340" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<path d="M140,340 L131,347.5 L149,362.5 L131,377.5 L149,392.5 L131,407.5 L149,422.5 L140,430" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="162" y="392" font-size="13" fill="#222" text-anchor="start" font-weight="bold">10kΩ</text>
<path d="M140,430 L140,470" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="140" y="492" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">GND（0V）</text>
<text x="255" y="252" font-size="12" fill="#222" text-anchor="start"></text>
<text x="275" y="350" font-size="13" fill="#222" text-anchor="start">スイッチが開いている。</text>
<text x="275" y="372" font-size="13" fill="#222" text-anchor="start">ピン2は 10kΩ だけで</text>
<text x="275" y="392" font-size="13" fill="#222" text-anchor="start">GND につながっている</text>
<text x="275" y="424" font-size="14" fill="#1565c0" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">digitalRead → LOW</text>
<text x="275" y="450" font-size="18" fill="#1565c0" text-anchor="start" font-weight="bold">画面に  0</text>
<rect x="500" y="60" width="450" height="480" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="725" y="92" font-size="17" fill="#c62828" text-anchor="middle" font-weight="bold">押している</text>
<text x="610" y="126" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">5V</text>
<path d="M610,134 L610,180" fill="none" stroke="#c62828" stroke-width="3"/>
<path d="M610,180 L610,250" fill="none" stroke="#c62828" stroke-width="3"/>
<circle cx="610" cy="180" r="4" fill="#222" stroke="#222" stroke-width="2"/>
<circle cx="610" cy="250" r="4" fill="#222" stroke="#222" stroke-width="2"/>
<text x="594" y="220" font-size="13" fill="#222" text-anchor="end" font-weight="bold">ボタン</text>
<path d="M610,250 L610,300" fill="none" stroke="#c62828" stroke-width="3"/>
<circle cx="610" cy="300" r="5" fill="#222" stroke="#222" stroke-width="2"/>
<path d="M610,300 L770,300" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#ar)"/>
<rect x="772" y="272" width="150" height="56" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
<text x="847" y="296" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">ピン2</text>
<text x="847" y="316" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">5V</text>
<path d="M610,300 L610,340" fill="none" stroke="#c62828" stroke-width="2.5"/>
<path d="M610,340 L601,347.5 L619,362.5 L601,377.5 L619,392.5 L601,407.5 L619,422.5 L610,430" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="632" y="392" font-size="13" fill="#222" text-anchor="start" font-weight="bold">10kΩ</text>
<path d="M610,430 L610,470" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="610" y="492" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">GND（0V）</text>
<text x="725" y="252" font-size="12" fill="#222" text-anchor="start"></text>
<text x="745" y="350" font-size="13" fill="#c62828" text-anchor="start" font-weight="bold">5V に直結。</text>
<text x="745" y="372" font-size="13" fill="#222" text-anchor="start">10kΩ には 5V ÷ 10,000Ω</text>
<text x="745" y="392" font-size="13" fill="#222" text-anchor="start">＝ 0.5mA だけ流れる</text>
<text x="745" y="424" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">digitalRead → HIGH</text>
<text x="745" y="450" font-size="18" fill="#c62828" text-anchor="start" font-weight="bold">画面に  1</text>
</svg>
