<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="560" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">反応時間ゲームの3つの状態：待っている間に押すと「フライング」</text>
<rect x="40" y="100" width="240" height="90" rx="10" fill="#eeeeee" stroke="#9e9e9e" stroke-width="3"/>
<text x="160" y="135" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">IDLE（待機）</text>
<text x="160" y="162" font-size="13" fill="#555" text-anchor="middle">ゲームをしていない</text>
<rect x="370" y="100" width="240" height="90" rx="10" fill="#fff8e1" stroke="#e65100" stroke-width="3"/>
<text x="490" y="135" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">WAITING（待ち）</text>
<text x="490" y="162" font-size="13" fill="#555" text-anchor="middle">ランダムな 2〜5秒を待つ</text>
<rect x="700" y="100" width="240" height="90" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
<text x="820" y="135" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">SHOWING（光った）</text>
<text x="820" y="162" font-size="13" fill="#555" text-anchor="middle">LED が光っている</text>
<path d="M280,130 L368,130" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#ab)"/>
<text x="324" y="118" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">リセットを押す</text>
<path d="M610,130 L698,130" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#ab)"/>
<text x="654" y="118" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">待ち時間が過ぎる</text>
<path d="M820,192 L820,260 L160,260 L160,192" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<text x="490" y="280" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">光ったあとに、ボタンを押す（正解でも、まちがいでも、この回は終わり）</text>
<path d="M490,192 L490,225 L240,225 L200,190" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#ar)"/>
<text x="490" y="215" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">待っている間に押す ＝ フライング</text>
<rect x="30" y="310" width="920" height="230" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="50" y="338" font-size="15" fill="#222" text-anchor="start" font-weight="bold">ボタンを押したときに起きること</text>
<text x="60" y="372" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">IDLE</text>
<text x="310" y="372" font-size="14" fill="#333" text-anchor="start">何もしない（ゲーム中でない）</text>
<text x="60" y="410" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">WAITING</text>
<text x="310" y="410" font-size="14" fill="#333" text-anchor="start">Flying! と出して、この回を終わる。LED は光らない</text>
<text x="60" y="448" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">SHOWING（正しいボタン）</text>
<text x="310" y="448" font-size="14" fill="#333" text-anchor="start">Correct! と、反応時間（光った時刻からの差）を出す</text>
<text x="60" y="486" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">SHOWING（ちがうボタン）</text>
<text x="310" y="486" font-size="14" fill="#333" text-anchor="start">Wrong Click! と出す</text>
<text x="50" y="530" font-size="12.5" fill="#555" text-anchor="start">どの回も、押したあとは IDLE にもどり、リセットを押すと、次の回が始まる</text>
</svg>
