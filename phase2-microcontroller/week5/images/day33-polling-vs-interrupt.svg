<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="560" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">delay(1000) のあいだにボタンを一瞬押すと、通常の読み取りは気づかず、割り込みは気づく</text>
<rect x="20" y="60" width="940" height="210" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="36" y="88" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">① 通常の読み取り（ポーリング）</text>
<rect x="60.0" y="110" width="280.6666666666667" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="200.33333333333334" y="135" font-size="13" fill="#222" text-anchor="middle">delay(1000)：1秒止まる</text>
<circle cx="343.6666666666667" cy="175" r="7" fill="#2e7d32" stroke="#222" stroke-width="1.5"/>
<text x="343.6666666666667" y="198" font-size="11.5" fill="#2e7d32" text-anchor="middle" font-weight="bold">ここで見る</text>
<rect x="346.6666666666667" y="110" width="280.6666666666667" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="487.0" y="135" font-size="13" fill="#222" text-anchor="middle">delay(1000)：1秒止まる</text>
<circle cx="630.3333333333334" cy="175" r="7" fill="#2e7d32" stroke="#222" stroke-width="1.5"/>
<text x="630.3333333333334" y="198" font-size="11.5" fill="#2e7d32" text-anchor="middle" font-weight="bold">ここで見る</text>
<rect x="633.3333333333334" y="110" width="280.6666666666667" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="773.6666666666667" y="135" font-size="13" fill="#222" text-anchor="middle">delay(1000)：1秒止まる</text>
<circle cx="917.0" cy="175" r="7" fill="#2e7d32" stroke="#222" stroke-width="1.5"/>
<text x="917.0" y="198" font-size="11.5" fill="#2e7d32" text-anchor="middle" font-weight="bold">ここで見る</text>
<path d="M330,240 L330,215" fill="none" stroke="#1565c0" stroke-width="4" marker-end="url(#ab)"/>
<text x="342" y="232" font-size="12.5" fill="#1565c0" text-anchor="start" font-weight="bold">ボタンを一瞬押す</text>
<text x="342" y="252" font-size="12.5" fill="#c62828" text-anchor="start" font-weight="bold">→ 見ていないので、気づかない（見のがす）</text>
<rect x="20" y="290" width="940" height="250" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="36" y="318" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold">② 割り込み</text>
<rect x="60.0" y="340" width="280.6666666666667" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="200.33333333333334" y="365" font-size="13" fill="#222" text-anchor="middle">delay(1000)：1秒止まる</text>
<rect x="346.6666666666667" y="340" width="280.6666666666667" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="487.0" y="365" font-size="13" fill="#222" text-anchor="middle">delay(1000)：1秒止まる</text>
<rect x="633.3333333333334" y="340" width="280.6666666666667" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="773.6666666666667" y="365" font-size="13" fill="#222" text-anchor="middle">delay(1000)：1秒止まる</text>
<path d="M330,470 L330,382" fill="none" stroke="#1565c0" stroke-width="4" marker-end="url(#ab)"/>
<text x="342" y="462" font-size="12.5" fill="#1565c0" text-anchor="start" font-weight="bold">ボタンを一瞬押す</text>
<rect x="250" y="400" width="160" height="42" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="330" y="418" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">noisy() が呼ばれる</text>
<text x="330" y="435" font-size="11.5" fill="#555" text-anchor="middle">ブザーが入れかわる</text>
<path d="M410,420 L465,420 L465,384" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="480" y="412" font-size="12" fill="#2e7d32" text-anchor="start">終わったら、止まっていた</text>
<text x="480" y="430" font-size="12" fill="#2e7d32" text-anchor="start">ところにもどる</text>
<text x="60" y="520" font-size="13" fill="#222" text-anchor="start" font-weight="bold">止まっている（delay のあいだ）でも、ボタンが変わった瞬間に、すぐ割り込んで、関数を動かす</text>
</svg>
