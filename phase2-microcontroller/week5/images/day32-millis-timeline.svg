<text x="375.0" y="322" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="bold">interval（次の音までの待ち時間）</text>
<text x="375.0" y="342" font-size="12" fill="#555" text-anchor="middle">この間も、loop() は止まらず回る</text>
