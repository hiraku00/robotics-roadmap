<text x="90" y="395" font-size="14" fill="#222" text-anchor="start" font-weight="bold">毎回の周回で、やっていること</text>
<text x="90" y="420" font-size="13" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">①  currentMillis ＝ いまの時刻</text>
<text x="90" y="442" font-size="13" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">②  currentMillis − previousMillis ≧ interval なら、音を出す（そうでなければ、何もしない）</text>
<text x="90" y="464" font-size="13" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">③  ボタンを読んで、LED を動かす（毎周回。待ち時間のあいだも）</text>
