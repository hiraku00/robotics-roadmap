<text x="90" y="228" font-size="13" fill="#555" text-anchor="start" font-weight="bold">loop() が1周するたび（とても速く、何度も回る）</text>
<path d="M250,240 L250,120" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#ar)"/>
