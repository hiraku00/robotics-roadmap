<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="700" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">5.3：loop() の中で、1周ごとに何をしているか</text>
<rect x="100.0" y="60" width="400" height="52" rx="8" fill="#fff" stroke="#90caf9" stroke-width="2"/>
<text x="300" y="80" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">① ボタンを読む</text>
<text x="300" y="100" font-size="12" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">buttonState = digitalRead(2)</text>
<path d="M300,112 L300,132" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<polygon points="300,134 500.0,176.0 300,218 100.0,176.0" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="300" y="174.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">② 前回と変わった？</text>
<text x="300" y="193.0" font-size="12" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">buttonState != lastButtonState</text>
<text x="308" y="238" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="bold">はい</text>
<path d="M300,218 L300,244" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
<polygon points="300,246 500.0,288.0 300,330 100.0,288.0" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="300" y="286.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">③ 押した瞬間？</text>
<text x="300" y="305.0" font-size="12" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">buttonState == HIGH</text>
<text x="308" y="350" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="bold">はい</text>
<path d="M300,330 L300,356" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="100.0" y="358" width="400" height="52" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="300" y="378" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">④ 切り替えて、画面に出す</text>
<text x="300" y="398" font-size="12" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">detectionState = (detectionState+1) % 2</text>
<path d="M300,410 L300,430" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="100.0" y="432" width="400" height="52" rx="8" fill="#fff" stroke="#90caf9" stroke-width="2"/>
<text x="300" y="452" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">⑤ 50ミリ秒待つ（チャタリングよけ）</text>
<text x="300" y="472" font-size="12" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">delay(50)</text>
<path d="M100.0,288 L70,288 L70,458 L100.0,458" fill="none" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#ax)"/>
<text x="76" y="280" font-size="13" fill="#777" text-anchor="start" font-weight="bold">いいえ</text>
<path d="M300,484 L300,504" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="100.0" y="506" width="400" height="52" rx="8" fill="#fff" stroke="#90caf9" stroke-width="2"/>
<text x="300" y="526" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">⑥ 今回の値を、前回として覚える</text>
<text x="300" y="546" font-size="12" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">lastButtonState = buttonState</text>
<path d="M500.0,176 L550.0,176 L550.0,532 L500.0,532" fill="none" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#ax)"/>
<text x="508.0" y="168" font-size="13" fill="#777" text-anchor="start" font-weight="bold">いいえ</text>
<path d="M300,558 L300,578" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="100.0" y="580" width="400" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="300" y="600" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">⑦ LED を、覚えている状態に合わせる</text>
<text x="300" y="620" font-size="12" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">1 なら HIGH（点灯）、0 なら LOW（消灯）</text>
<path d="M100.0,606 L30,606 L30,86 L100.0,86" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<text x="18" y="350" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">↑</text>
<text x="44" y="668" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="bold">loop() の先頭へもどる（これを1秒に何千回もくり返す）</text>
<text x="680" y="86" font-size="12.5" fill="#333" text-anchor="start">押している最中は、毎回 ① → ② →</text>
<text x="680" y="106" font-size="12.5" fill="#333" text-anchor="start">⑥ → ⑦ だけを通る（④ には行かない）</text>
<text x="680" y="176" font-size="12.5" fill="#333" text-anchor="start">「前の周」の値と比べるので、</text>
<text x="680" y="196" font-size="12.5" fill="#333" text-anchor="start">押した瞬間と離した瞬間だけ「はい」</text>
<text x="680" y="288" font-size="12.5" fill="#333" text-anchor="start">離した瞬間は ② は「はい」だが</text>
<text x="680" y="308" font-size="12.5" fill="#333" text-anchor="start">③ が「いいえ」なので切り替えない</text>
<text x="680" y="384" font-size="12.5" fill="#333" text-anchor="start">切り替えは、押した瞬間の1回だけ</text>
<text x="680" y="458" font-size="12.5" fill="#333" text-anchor="start">変化を見たときだけ止まる</text>
<text x="680" y="478" font-size="12.5" fill="#333" text-anchor="start">（記事によるとチャタリング対策）</text>
<text x="680" y="532" font-size="12.5" fill="#333" text-anchor="start">次の周のために、いまの値を保存</text>
<text x="680" y="606" font-size="12.5" fill="#333" text-anchor="start">LED はボタンではなく</text>
<text x="680" y="626" font-size="12.5" fill="#333" text-anchor="start">detectionState を見て動く</text>
</svg>
