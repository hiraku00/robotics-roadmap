<text x="490" y="572" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">ピンの電圧が本当に 2.5V になるわけではない。5V の時間と 0V の時間が半分ずつで、LED には平均の明るさに見える</text>
<text x="490" y="598" font-size="12.5" fill="#555" text-anchor="middle">（1秒に約 490回の切りかえで、目では点滅が見えない。数字は記事外で、確かめていない）</text>
<text x="490" y="624" font-size="13" fill="#222" text-anchor="middle">平均電圧 ＝ 5V × value ÷ 255（計算。電圧は測っていない）</text>
