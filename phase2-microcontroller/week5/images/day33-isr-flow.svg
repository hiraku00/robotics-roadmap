<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="470" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">割り込みの流れ：今の処理を一時停止 → 割り込み関数 → もとにもどる</text>
<rect x="60" y="150" width="340" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="230" y="180" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">loop()：delay(1000) の途中</text>
<path d="M400,175 L450,175" fill="none" stroke="#9e9e9e" stroke-width="3"/>
<path d="M450,120 L450,175" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#ar)"/>
<text x="450" y="108" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">ボタンが変わる</text>
<rect x="455" y="140" width="150" height="70" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
<text x="530" y="164" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">ISR：noisy()</text>
<text x="530" y="186" font-size="12" fill="#555" text-anchor="middle">2行だけ。短い</text>
<path d="M605,175 L650,175" fill="none" stroke="#9e9e9e" stroke-width="3"/>
<rect x="650" y="150" width="270" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="785" y="180" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">loop()：止まっていた所から続き</text>
<text x="60" y="250" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">①</text>
<text x="95" y="250" font-size="14" fill="#222" text-anchor="start">ボタンが変わる（押した／離した）</text>
<text x="60" y="284" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">②</text>
<text x="95" y="284" font-size="14" fill="#222" text-anchor="start">今の処理（delay の途中）を、一時停止</text>
<text x="60" y="318" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">③</text>
<text x="95" y="318" font-size="14" fill="#222" text-anchor="start">ISR（noisy）を実行。ブザーの状態を入れかえる</text>
<text x="60" y="352" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">④</text>
<text x="95" y="352" font-size="14" fill="#222" text-anchor="start">終わったら、止まっていた所にもどる</text>
<rect x="30" y="395" width="920" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="420" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">ISR は短く書く：ISR が動いているあいだ、loop() は止まり、ほかの割り込みも待たされる</text>
<text x="490" y="442" font-size="12.5" fill="#555" text-anchor="middle">（記事外：ISR の中で delay() や Serial.print() を使うのは、避ける）</text>
</svg>
