<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="470" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">反応時間 ＝ ボタンを押した時刻 − LED が光った時刻</text>
<path d="M60,190 L920,190" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<text x="920" y="220" font-size="13" fill="#222" text-anchor="end">時間</text>
<path d="M120,135 L120,200" fill="none" stroke="#1565c0" stroke-width="3"/>
<circle cx="120" cy="190" r="8" fill="#1565c0" stroke="#222" stroke-width="1.5"/>
<text x="120" y="125" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">リセットを押す</text>
<text x="120" y="222" font-size="13" fill="#222" text-anchor="middle" font-family="Menlo, Consolas, monospace">Waiting...</text>
<path d="M330,135 L330,200" fill="none" stroke="#c62828" stroke-width="3"/>
<circle cx="330" cy="190" r="8" fill="#c62828" stroke="#222" stroke-width="1.5"/>
<text x="330" y="125" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">待ち時間（2〜5秒）が過ぎて、LED が光る</text>
<text x="330" y="222" font-size="13" fill="#222" text-anchor="middle" font-family="Menlo, Consolas, monospace">Light!</text>
<path d="M700,135 L700,200" fill="none" stroke="#2e7d32" stroke-width="3"/>
<circle cx="700" cy="190" r="8" fill="#2e7d32" stroke="#222" stroke-width="1.5"/>
<text x="700" y="125" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">正しいボタンを押す</text>
<text x="700" y="222" font-size="13" fill="#222" text-anchor="middle" font-family="Menlo, Consolas, monospace">Correct!</text>
<rect x="120" y="235" width="206" height="34" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="2"/>
<text x="222" y="258" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">待っている間（WAITING）</text>
<text x="222" y="286" font-size="12.5" fill="#c62828" text-anchor="middle" font-weight="bold">押すと Flying!</text>
<path d="M333,250 L697,250" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<path d="M697,250 L333,250" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<text x="515" y="240" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">反応時間</text>
<text x="515" y="285" font-size="14" fill="#2e7d32" text-anchor="middle" font-family="Menlo, Consolas, monospace">now − lightTime</text>
<text x="330" y="88" font-size="12.5" fill="#c62828" text-anchor="middle" font-family="Menlo, Consolas, monospace">lightTime ＝ millis()</text>
<text x="700" y="88" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-family="Menlo, Consolas, monospace">now ＝ millis()（割り込みの中）</text>
<rect x="30" y="340" width="920" height="110" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="50" y="368" font-size="13.5" fill="#222" text-anchor="start" font-weight="bold">millis() ＝ Arduino を動かしてからの時間（ミリ秒）。2つの時刻の差が、そのまま反応時間</text>
<text x="50" y="396" font-size="13" fill="#555" text-anchor="start">光った時刻（lightTime）は、LED を光らせる直前に記録する（loop() の中）</text>
<text x="50" y="420" font-size="13" fill="#555" text-anchor="start">押した時刻（now）は、割り込みの中で読む（押した瞬間に近い。loop() の遅れが入らない）</text>
</svg>
