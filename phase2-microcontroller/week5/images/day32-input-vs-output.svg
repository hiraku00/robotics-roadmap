<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="520" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">ピン2が OUTPUT（LOW）のまま 5V が来ると、ショート。INPUT なら、ただ聞くだけ</text>
<rect x="30" y="60" width="450" height="400" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="46" y="90" font-size="14.5" fill="#c62828" text-anchor="start" font-weight="bold">まちがい：pinMode(buttonPin, OUTPUT)</text>
<rect x="250" y="120" width="200" height="250" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2.5"/>
<text x="350" y="146" font-size="13.5" fill="#00796b" text-anchor="middle" font-weight="bold">Arduino のピン2</text>
<text x="350" y="176" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">OUTPUT（LOW）</text>
<text x="350" y="198" font-size="13" fill="#555" text-anchor="middle">0V を出している</text>
<path d="M350,216 L350,262" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#ab)"/>
<text x="362" y="244" font-size="12" fill="#1565c0" text-anchor="start" font-weight="bold">0V を出す</text>
<circle cx="250" cy="310" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
<path d="M245,310 L150,310" fill="none" stroke="#c62828" stroke-width="3"/>
<circle cx="150" cy="310" r="5" fill="#222" stroke="#222" stroke-width="2"/>
<path d="M150,310 L150,240" fill="none" stroke="#c62828" stroke-width="3"/>
<text x="150" y="148" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">5V</text>
<path d="M150,156 L150,190" fill="none" stroke="#c62828" stroke-width="3"/>
<line x1="150" y1="190" x2="150" y2="240" stroke="#c62828" stroke-width="3"/>
<text x="130" y="235" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">ボタンを押す</text>
<path d="M150,310 L150,346" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<text x="130" y="372" font-size="12" fill="#555" text-anchor="end">10kΩ → GND</text>
<text x="255" y="410" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">0V を出しているピンに、5V がつながる</text>
<text x="255" y="432" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">＝ ショート → 爆発のマーク</text>
<rect x="500" y="60" width="450" height="400" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
<text x="516" y="90" font-size="14.5" fill="#2e7d32" text-anchor="start" font-weight="bold">正しい：pinMode(buttonPin, INPUT)</text>
<rect x="720" y="120" width="200" height="250" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2.5"/>
<text x="820" y="146" font-size="13.5" fill="#00796b" text-anchor="middle" font-weight="bold">Arduino のピン2</text>
<text x="820" y="176" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">INPUT</text>
<text x="820" y="198" font-size="13" fill="#555" text-anchor="middle">電圧を聞くだけ</text>
<circle cx="720" cy="310" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
<path d="M715,310 L620,310" fill="none" stroke="#c62828" stroke-width="3"/>
<circle cx="620" cy="310" r="5" fill="#222" stroke="#222" stroke-width="2"/>
<path d="M620,310 L620,240" fill="none" stroke="#c62828" stroke-width="3"/>
<text x="620" y="148" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">5V</text>
<path d="M620,156 L620,190" fill="none" stroke="#c62828" stroke-width="3"/>
<line x1="620" y1="190" x2="620" y2="240" stroke="#c62828" stroke-width="3"/>
<text x="600" y="235" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">ボタンを押す</text>
<path d="M620,310 L620,346" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
<text x="600" y="372" font-size="12" fill="#555" text-anchor="end">10kΩ → GND</text>
<text x="725" y="410" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">5V を聞くだけ。電流はほとんど流れない</text>
<text x="725" y="432" font-size="13" fill="#555" text-anchor="middle">（10kΩ に 0.5mA。LED が点く）</text>
<rect x="30" y="474" width="920" height="38" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="498" font-size="13.5" fill="#222" text-anchor="middle">記事のコードは、ピン2を OUTPUT にしていた。INPUT に直したら、ボタンを押しても爆発しなくなった（Tinkercad で確かめた）</text>
</svg>
