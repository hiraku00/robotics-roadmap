<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="470" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">setup() は1回だけ、loop() はずっと繰り返す</text>
<rect x="30" y="170" width="150" height="80" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="105" y="203" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">電源を入れる</text>
<text x="105" y="228" font-size="13" fill="#222" text-anchor="middle">（またはリセット）</text>
<path d="M180,210 L228,210" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="230" y="120" width="290" height="180" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="375" y="150" font-size="18" fill="#1565c0" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">setup()</text>
<text x="375" y="174" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">最初に1回だけ</text>
<text x="250" y="208" font-size="14" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">pinMode(9, OUTPUT);</text>
<text x="250" y="228" font-size="13" fill="#555" text-anchor="start">ピン9を出力にする</text>
<text x="250" y="258" font-size="14" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">Serial.begin(9600);</text>
<text x="250" y="278" font-size="13" fill="#555" text-anchor="start">通信の速さを決める</text>
<path d="M520,210 L568,210" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="570" y="60" width="380" height="330" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="590" y="90" font-size="18" fill="#2e7d32" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">loop()</text>
<text x="665" y="90" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">電源を切るまで、ずっと繰り返す</text>
<rect x="590" y="108" width="290" height="46" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="602" y="136" font-size="14" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">digitalWrite(9, HIGH);</text>
<text x="870" y="136" font-size="13" fill="#555" text-anchor="end">点ける</text>
<path d="M735,154 L735,174" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="590" y="176" width="290" height="46" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="602" y="204" font-size="14" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">delay(500);</text>
<text x="870" y="204" font-size="13" fill="#555" text-anchor="end">0.5秒待つ</text>
<path d="M735,222 L735,242" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="590" y="244" width="290" height="46" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="602" y="272" font-size="14" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">digitalWrite(9, LOW);</text>
<text x="870" y="272" font-size="13" fill="#555" text-anchor="end">消す</text>
<path d="M735,290 L735,310" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="590" y="312" width="290" height="46" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="602" y="340" font-size="14" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">delay(500);</text>
<text x="870" y="340" font-size="13" fill="#555" text-anchor="end">0.5秒待つ</text>
<path d="M880,335 L920,335 L920,131 L882,131" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<text x="932" y="238" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">戻</text>
<text x="932" y="256" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">る</text>
<rect x="30" y="410" width="920" height="44" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
<text x="490" y="438" font-size="14" fill="#222" text-anchor="middle">たとえ：setup() ＝ 朝の身じたく（1回だけ）　／　loop() ＝ その日の仕事のくり返し（終業の合図がない）</text>
</svg>
