<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="400" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">ピン9の電圧の変わり方：0.5秒ごとに 5V と 0V を行ったり来たり</text>
<path d="M110,90 L110,280" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M110,250 L870,250" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="98" y="135" font-size="13" fill="#c62828" text-anchor="end" font-weight="bold">5V（HIGH）</text>
<text x="98" y="255" font-size="13" fill="#555" text-anchor="end" font-weight="bold">0V（LOW）</text>
<text x="874" y="272" font-size="13" fill="#222" text-anchor="end">時間</text>
<rect x="110" y="130" width="120" height="120" fill="#ffebee"/>
<text x="170.0" y="118" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">点く</text>
<text x="290.0" y="236" font-size="14" fill="#777" text-anchor="middle" font-weight="bold">消える</text>
<rect x="350" y="130" width="120" height="120" fill="#ffebee"/>
<text x="410.0" y="118" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">点く</text>
<text x="530.0" y="236" font-size="14" fill="#777" text-anchor="middle" font-weight="bold">消える</text>
<rect x="590" y="130" width="120" height="120" fill="#ffebee"/>
<text x="650.0" y="118" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">点く</text>
<text x="770.0" y="236" font-size="14" fill="#777" text-anchor="middle" font-weight="bold">消える</text>
<path d="M110,130 L230,130 L230,250 L350,250 L350,130 L470,130 L470,250 L590,250 L590,130 L710,130 L710,250 L830,250" fill="none" stroke="#c62828" stroke-width="3.5"/>
<path d="M110,250 L110,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="110" y="274" font-size="12" fill="#222" text-anchor="middle">0</text>
<path d="M230,250 L230,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="230" y="274" font-size="12" fill="#222" text-anchor="middle">0.5秒</text>
<path d="M350,250 L350,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="350" y="274" font-size="12" fill="#222" text-anchor="middle">1.0秒</text>
<path d="M470,250 L470,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="470" y="274" font-size="12" fill="#222" text-anchor="middle">1.5秒</text>
<path d="M590,250 L590,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="590" y="274" font-size="12" fill="#222" text-anchor="middle">2.0秒</text>
<path d="M710,250 L710,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="710" y="274" font-size="12" fill="#222" text-anchor="middle">2.5秒</text>
<path d="M830,250 L830,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="830" y="274" font-size="12" fill="#222" text-anchor="middle">3.0秒</text>
<text x="170.0" y="200" font-size="13" fill="#222" text-anchor="middle" font-family="Menlo, Consolas, monospace">delay(500)</text>
<text x="290.0" y="200" font-size="13" fill="#222" text-anchor="middle" font-family="Menlo, Consolas, monospace">delay(500)</text>
<path d="M118,320 L112,280" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>
<text x="50" y="340" font-size="13" fill="#1565c0" text-anchor="start" font-family="Menlo, Consolas, monospace">digitalWrite(9, HIGH)</text>
<text x="50" y="360" font-size="13" fill="#1565c0" text-anchor="start">ここで 5V に上げる</text>
<path d="M290,320 L234,280" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>
<text x="250" y="340" font-size="13" fill="#1565c0" text-anchor="start" font-family="Menlo, Consolas, monospace">digitalWrite(9, LOW)</text>
<text x="250" y="360" font-size="13" fill="#1565c0" text-anchor="start">ここで 0V に下げる</text>
<path d="M356,300 L584,300" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<path d="M584,300 L356,300" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<text x="470" y="322" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">loop() 1回ぶん ＝ 500 ＋ 500 ＝ 1000ミリ秒 ＝ 1秒</text>
<text x="710" y="345" font-size="13" fill="#555" text-anchor="middle">→ 以下、同じことの繰り返し</text>
</svg>
