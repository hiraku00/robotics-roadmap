<text x="490" y="590" font-size="13.5" fill="#222" text-anchor="middle" font-weight="bold">511 → 511 × 180 ÷ 1023 ＝ 89.9… → 小数点以下を切り捨てて 89 度　／　511 × 255 ÷ 1023 ＝ 127.4… → 127</text>
<text x="490" y="612" font-size="12.5" fill="#555" text-anchor="middle">サーボ版は Tinkercad の画面で確かめた（0-&gt;0、511-&gt;89、1023-&gt;180）。LED 版（0〜255）は、まだ組んでいない計算だけ</text>
