<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1000" height="620" fill="#fff"/><text x="500" y="32" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">可変抵抗 → analogRead → map → write → サーボ</text><rect x="20" y="62" width="160" height="80" rx="8" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/><text x="100.0" y="97.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">可変抵抗器</text><text x="100.0" y="117.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">（つまみ）</text><rect x="250" y="62" width="170" height="80" rx="8" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/><text x="335.0" y="97.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">val</text><text x="335.0" y="117.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">0〜1023</text><rect x="500" y="62" width="170" height="80" rx="8" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/><text x="585.0" y="97.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">angle</text><text x="585.0" y="117.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">0〜180</text><rect x="750" y="62" width="230" height="80" rx="8" fill="#fff4e0" stroke="#d9660a" stroke-width="2"/><text x="865.0" y="97.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">サーボ</text><text x="865.0" y="117.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">angle 度の位置へ</text><line x1="180" y1="102.0" x2="250" y2="102.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><text x="215" y="92.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal">A0</text><line x1="420" y1="102.0" x2="500" y2="102.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><text x="460" y="76.0" font-size="14" fill="#c00000" text-anchor="middle" font-weight="bold">map()</text><line x1="670" y1="102.0" x2="750" y2="102.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><text x="710" y="76.0" font-size="14" fill="#c00000" text-anchor="middle" font-weight="bold">write()</text><text x="215" y="136.0" font-size="12" fill="#666" text-anchor="middle" font-weight="normal">analogRead</text><text x="460" y="136.0" font-size="12" fill="#666" text-anchor="middle" font-weight="normal">(val,0,1023,0,180)</text><text x="110" y="190" font-size="16" fill="#1f5fbf" text-anchor="start" font-weight="bold">val（analogRead の値）</text><text x="110" y="482" font-size="16" fill="#d9660a" text-anchor="start" font-weight="bold">angle（サーボの角度）</text><line x1="110" y1="240" x2="890" y2="240" stroke="#1f5fbf" stroke-width="4" stroke-linecap="round"/><line x1="110" y1="420" x2="890" y2="420" stroke="#d9660a" stroke-width="4" stroke-linecap="round"/><line x1="110.0" y1="240" x2="110.0" y2="420" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="110.0" cy="240" r="6" fill="#1f5fbf" stroke="#fff" stroke-width="2"/><circle cx="110.0" cy="420" r="6" fill="#d9660a" stroke="#fff" stroke-width="2"/><text x="110.0" y="226" font-size="15" fill="#1f5fbf" text-anchor="middle" font-weight="bold">0</text><text x="110.0" y="446" font-size="16" fill="#d9660a" text-anchor="middle" font-weight="bold">0</text><line x1="328.06451612903226" y1="240" x2="328.06451612903226" y2="420" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="328.06451612903226" cy="240" r="6" fill="#1f5fbf" stroke="#fff" stroke-width="2"/><circle cx="328.06451612903226" cy="420" r="6" fill="#d9660a" stroke="#fff" stroke-width="2"/><text x="328.06451612903226" y="226" font-size="15" fill="#1f5fbf" text-anchor="middle" font-weight="bold">286</text><text x="328.06451612903226" y="446" font-size="16" fill="#d9660a" text-anchor="middle" font-weight="bold">50</text><text x="328.06451612903226" y="274" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">計算 50.3</text><text x="328.06451612903226" y="292" font-size="13" fill="#c00000" text-anchor="middle" font-weight="normal">→ 切り捨てて 50</text><line x1="499.61876832844575" y1="240" x2="499.61876832844575" y2="420" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="499.61876832844575" cy="240" r="6" fill="#1f5fbf" stroke="#fff" stroke-width="2"/><circle cx="499.61876832844575" cy="420" r="6" fill="#d9660a" stroke="#fff" stroke-width="2"/><text x="499.61876832844575" y="226" font-size="15" fill="#1f5fbf" text-anchor="middle" font-weight="bold">511</text><text x="499.61876832844575" y="446" font-size="16" fill="#d9660a" text-anchor="middle" font-weight="bold">89</text><text x="499.61876832844575" y="274" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">計算 89.9</text><text x="499.61876832844575" y="292" font-size="13" fill="#c00000" text-anchor="middle" font-weight="normal">→ 切り捨てて 89</text><line x1="687.1847507331378" y1="240" x2="687.1847507331378" y2="420" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="687.1847507331378" cy="240" r="6" fill="#1f5fbf" stroke="#fff" stroke-width="2"/><circle cx="687.1847507331378" cy="420" r="6" fill="#d9660a" stroke="#fff" stroke-width="2"/><text x="687.1847507331378" y="226" font-size="15" fill="#1f5fbf" text-anchor="middle" font-weight="bold">757</text><text x="687.1847507331378" y="446" font-size="16" fill="#d9660a" text-anchor="middle" font-weight="bold">133</text><text x="687.1847507331378" y="274" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">計算 133.2</text><text x="687.1847507331378" y="292" font-size="13" fill="#c00000" text-anchor="middle" font-weight="normal">→ 切り捨てて 133</text><line x1="890.0" y1="240" x2="890.0" y2="420" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="890.0" cy="240" r="6" fill="#1f5fbf" stroke="#fff" stroke-width="2"/><circle cx="890.0" cy="420" r="6" fill="#d9660a" stroke="#fff" stroke-width="2"/><text x="890.0" y="226" font-size="15" fill="#1f5fbf" text-anchor="middle" font-weight="bold">1023</text><text x="890.0" y="446" font-size="16" fill="#d9660a" text-anchor="middle" font-weight="bold">180</text><text x="500" y="520" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">map は、小数点以下を切り捨てる。511 なら 89.9 でなく 89 になる（511 × 180 ÷ 1023 ＝ 89.9…）。</text><text x="500" y="548" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">つまみを回すと、val も angle も直線のとおりに変わる（左の端が 0、右の端が最大）。</text></svg>