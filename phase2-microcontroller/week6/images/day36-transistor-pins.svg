</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">トランジスタの3本の足：向きで名前が入れかわる。3回めに、すべて合った</text>
<rect x="20" y="70" width="940" height="125" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
<text x="36" y="98" font-size="15" fill="#222" text-anchor="start" font-weight="bold">1回め（最初）</text>
<text x="36" y="148" font-size="13" fill="#555" text-anchor="start">すべて、ちがう足に</text>
<text x="36" y="168" font-size="13" fill="#555" text-anchor="start">つないでいた</text>
<rect x="280" y="88" width="200" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="380" y="112" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">左の足 ＝ E</text>
<text x="380" y="138" font-size="13" fill="#222" text-anchor="middle">つないだもの：抵抗</text>
<text x="380" y="164" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">✗ ちがう</text>
<rect x="500" y="88" width="200" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="600" y="112" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">真ん中の足 ＝ B</text>
<text x="600" y="138" font-size="13" fill="#222" text-anchor="middle">つないだもの：モーター</text>
<text x="600" y="164" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">✗ ちがう</text>
<rect x="720" y="88" width="200" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="820" y="112" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">右の足 ＝ C</text>
<text x="820" y="138" font-size="13" fill="#222" text-anchor="middle">つないだもの：GND</text>
<text x="820" y="164" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">✗ ちがう</text>
<rect x="20" y="210" width="940" height="125" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
<text x="36" y="238" font-size="15" fill="#222" text-anchor="start" font-weight="bold">2回め（電池にした後）</text>
<text x="36" y="288" font-size="13" fill="#555" text-anchor="start">エミッタだけ合った</text>
<text x="36" y="308" font-size="13" fill="#555" text-anchor="start">抵抗とモーターが逆</text>
<rect x="280" y="228" width="200" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="380" y="252" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">左の足 ＝ C</text>
<text x="380" y="278" font-size="13" fill="#222" text-anchor="middle">つないだもの：抵抗</text>
<text x="380" y="304" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">✗ ちがう</text>
<rect x="500" y="228" width="200" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="600" y="252" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">真ん中の足 ＝ B</text>
<text x="600" y="278" font-size="13" fill="#222" text-anchor="middle">つないだもの：モーター</text>
<text x="600" y="304" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">✗ ちがう</text>
<rect x="720" y="228" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="820" y="252" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">右の足 ＝ E</text>
<text x="820" y="278" font-size="13" fill="#222" text-anchor="middle">つないだもの：GND</text>
<text x="820" y="304" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">✓ 合っている</text>
<rect x="20" y="350" width="940" height="125" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
<text x="36" y="378" font-size="15" fill="#222" text-anchor="start" font-weight="bold">3回め（最終）</text>
<text x="36" y="428" font-size="13" fill="#555" text-anchor="start">すべて合った</text>
<text x="36" y="448" font-size="13" fill="#555" text-anchor="start">モーターが回った</text>
<rect x="280" y="368" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="380" y="392" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">左の足 ＝ C</text>
<text x="380" y="418" font-size="13" fill="#222" text-anchor="middle">つないだもの：モーター</text>
<text x="380" y="444" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">✓ 合っている</text>
<rect x="500" y="368" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="600" y="392" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">真ん中の足 ＝ B</text>
<text x="600" y="418" font-size="13" fill="#222" text-anchor="middle">つないだもの：抵抗</text>
<text x="600" y="444" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">✓ 合っている</text>
<rect x="720" y="368" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="820" y="392" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">右の足 ＝ E</text>
<text x="820" y="418" font-size="13" fill="#222" text-anchor="middle">つないだもの：GND</text>
<text x="820" y="444" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">✓ 合っている</text>
<rect x="20" y="495" width="940" height="48" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="516" font-size="13.5" fill="#222" text-anchor="middle" font-weight="bold">足の名前は、置く向きで入れかわる。回路図表示や、足にマウスを乗せて、名前を確かめる</text>
<text x="490" y="536" font-size="13" fill="#555" text-anchor="middle">正しい形：ベースは抵抗（ピン側）、コレクタはモーター、エミッタは GND</text>
</svg>
