<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1000" height="620" fill="#fff"/><text x="500" y="34" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">analogWrite の値 → デューティー比 → モーターにかかる平均の電圧</text><text x="20" y="68" font-size="14" fill="#555" text-anchor="start" font-weight="normal">山の高さは 3V（電池）。ピンの 5V は、トランジスタの B を動かすだけで、モーターには直接かからない。</text><text x="20" y="130" font-size="17" fill="#222" text-anchor="start" font-weight="bold">analogWrite(3, 50)</text><text x="20" y="154" font-size="14" fill="#444" text-anchor="start" font-weight="normal">デューティー比 19%（50÷255）</text><text x="20" y="174" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">平均 0.59V → -1080 rpm</text><line x1="370" y1="170" x2="940" y2="170" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M380,170 L380,120 L399.6078431372549,120 L399.6078431372549,170 L480,170 L480,120 L499.6078431372549,120 L499.6078431372549,170 L580,170 L580,120 L599.6078431372549,120 L599.6078431372549,170 L680,170 L680,120 L699.6078431372549,120 L699.6078431372549,170 L780,170 L780,120 L799.6078431372549,120 L799.6078431372549,170 L880,170" stroke="#1f5fbf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="370" y1="160.19607843137254" x2="940" y2="160.19607843137254" stroke="#d9660a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="946" y="165.19607843137254" font-size="13" fill="#d9660a" text-anchor="start" font-weight="normal">平均</text><text x="20" y="230" font-size="17" fill="#222" text-anchor="start" font-weight="bold">analogWrite(3, 100)</text><text x="20" y="254" font-size="14" fill="#444" text-anchor="start" font-weight="normal">デューティー比 39%（100÷255）</text><text x="20" y="274" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">平均 1.18V → -1980 rpm</text><line x1="370" y1="270" x2="940" y2="270" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M380,270 L380,220 L419.21568627450984,220 L419.21568627450984,270 L480,270 L480,220 L519.2156862745098,220 L519.2156862745098,270 L580,270 L580,220 L619.2156862745098,220 L619.2156862745098,270 L680,270 L680,220 L719.2156862745098,220 L719.2156862745098,270 L780,270 L780,220 L819.2156862745098,220 L819.2156862745098,270 L880,270" stroke="#1f5fbf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="370" y1="250.39215686274508" x2="940" y2="250.39215686274508" stroke="#d9660a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="946" y="255.39215686274508" font-size="13" fill="#d9660a" text-anchor="start" font-weight="normal">平均</text><text x="20" y="330" font-size="17" fill="#222" text-anchor="start" font-weight="bold">analogWrite(3, 150)</text><text x="20" y="354" font-size="14" fill="#444" text-anchor="start" font-weight="normal">デューティー比 58%（150÷255）</text><text x="20" y="374" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">平均 1.76V → -3100 rpm</text><line x1="370" y1="370" x2="940" y2="370" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M380,370 L380,320 L438.8235294117647,320 L438.8235294117647,370 L480,370 L480,320 L538.8235294117648,320 L538.8235294117648,370 L580,370 L580,320 L638.8235294117648,320 L638.8235294117648,370 L680,370 L680,320 L738.8235294117648,320 L738.8235294117648,370 L780,370 L780,320 L838.8235294117648,320 L838.8235294117648,370 L880,370" stroke="#1f5fbf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="370" y1="340.5882352941176" x2="940" y2="340.5882352941176" stroke="#d9660a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="946" y="345.5882352941176" font-size="13" fill="#d9660a" text-anchor="start" font-weight="normal">平均</text><text x="20" y="430" font-size="17" fill="#222" text-anchor="start" font-weight="bold">analogWrite(3, 200)</text><text x="20" y="454" font-size="14" fill="#444" text-anchor="start" font-weight="normal">デューティー比 78%（200÷255）</text><text x="20" y="474" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">平均 2.35V → -4000 rpm</text><line x1="370" y1="470" x2="940" y2="470" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M380,470 L380,420 L458.4313725490196,420 L458.4313725490196,470 L480,470 L480,420 L558.4313725490197,420 L558.4313725490197,470 L580,470 L580,420 L658.4313725490197,420 L658.4313725490197,470 L680,470 L680,420 L758.4313725490197,420 L758.4313725490197,470 L780,470 L780,420 L858.4313725490197,420 L858.4313725490197,470 L880,470" stroke="#1f5fbf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="370" y1="430.78431372549016" x2="940" y2="430.78431372549016" stroke="#d9660a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="946" y="435.78431372549016" font-size="13" fill="#d9660a" text-anchor="start" font-weight="normal">平均</text><text x="20" y="530" font-size="17" fill="#222" text-anchor="start" font-weight="bold">analogWrite(3, 255)</text><text x="20" y="554" font-size="14" fill="#444" text-anchor="start" font-weight="normal">デューティー比 100%（255÷255）</text><text x="20" y="574" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">平均 3.00V → -5136 rpm</text><line x1="370" y1="570" x2="940" y2="570" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M380,570 L380,520 L480,520 L480,520 L580,520 L580,520 L680,520 L680,520 L780,520 L780,520 L880,520" stroke="#1f5fbf" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="370" y1="520.0" x2="940" y2="520.0" stroke="#d9660a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="946" y="525.0" font-size="13" fill="#d9660a" text-anchor="start" font-weight="normal">平均</text><text x="380" y="92" font-size="13" fill="#666" text-anchor="start" font-weight="normal">← 時間（1周期 約 2ms = 490Hz）</text><text x="710" y="92" font-size="13" fill="#666" text-anchor="start" font-weight="normal">青：ON/OFF　橙の点線：平均</text></svg>