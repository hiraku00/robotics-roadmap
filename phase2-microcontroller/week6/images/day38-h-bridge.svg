l="#333" text-anchor="middle" font-weight="bold">M</text><path d="M160,140 L160,216 L320,216 L320,406" stroke="#1f5fbf" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ab)"/><text x="240" y="208" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold">電流</text><line x1="560" y1="140" x2="920" y2="140" stroke="#c00000" stroke-width="3" stroke-linecap="round"/><text x="560" y="128" font-size="15" fill="#c00000" text-anchor="start" font-weight="bold">5V（VCC2）</text><line x1="560" y1="420" x2="920" y2="420" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="560" y="442" font-size="15" fill="#333" text-anchor="start" font-weight="bold">GND</text><line x1="610" y1="140" x2="610" y2="184" stroke="#333" stroke-width="3" stroke-linecap="round"/><rect x="576" y="184" width="68" height="32" rx="6" fill="#eee" stroke="#999" stroke-width="2"/><text x="610" y="206" font-size="14" fill="#888" text-anchor="middle" font-weight="bold">S1 切</text><line x1="610" y1="216" x2="610" y2="280" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="610" y1="280" x2="610" y2="324" stroke="#333" stroke-width="3" stroke-linecap="round"/><rect x="576" y="324" width="68" height="32" rx="6" fill="#cdeccd" stroke="#2a8a2a" stroke-width="2"/><text x="610" y="346" font-size="14" fill="#1a6a1a" text-anchor="middle" font-weight="bold">S2 入</text><line x1="610" y1="356" x2="610" y2="420" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="870" y1="140" x2="870" y2="184" stroke="#333" stroke-width="3" stroke-linecap="round"/><rect x="836" y="184" width="68" height="32" rx="6" fill="#cdeccd" stroke="#2a8a2a" stroke-width="2"/><text x="870" y="206" font-size="14" fill="#1a6a1a" text-anchor="middle" font-weight="bold">S3 入</text><line x1="870" y1="216" x2="870" y2="280" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="870" y1="280" x2="870" y2="324" stroke="#333" stroke-width="3" stroke-linecap="ro