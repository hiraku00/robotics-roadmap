<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1000" height="520" fill="#fff"/><text x="500" y="32" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">L293D の中の H ブリッジ（1,2 の側）：スイッチ4つで、電流の向きを変える</text><text x="20" y="70" font-size="18" fill="#1f5fbf" text-anchor="start" font-weight="bold">① 1A=HIGH、2A=LOW → 回る</text><text x="520" y="70" font-size="18" fill="#d9660a" text-anchor="start" font-weight="bold">② 1A=LOW、2A=HIGH → 逆向きに回る</text><text x="20" y="94" font-size="14" fill="#444" text-anchor="start" font-weight="normal">1Y が 5V 側、2Y が GND 側。電流は 1Y → モーター → 2Y</text><text x="520" y="94" font-size="14" fill="#444" text-anchor="start" font-weight="normal">1Y が GND 側、2Y が 5V 側。電流は 2Y → モーター → 1Y</text><line x1="60" y1="140" x2="420" y2="140" stroke="#c00000" stroke-width="3" stroke-linecap="round"/><text x="60" y="128" font-size="15" fill="#c00000" text-anchor="start" font-weight="bold">5V（VCC2）</text><line x1="60" y1="420" x2="420" y2="420" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="60" y="442" font-size="15" fill="#333" text-anchor="start" font-weight="bold">GND</text><line x1="110" y1="140" x2="110" y2="184" stroke="#333" stroke-width="3" stroke-linecap="round"/><rect x="76" y="184" width="68" height="32" rx="6" fill="#cdeccd" stroke="#2a8a2a" stroke-width="2"/><text x="110" y="206" font-size="14