<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="960" height="580" fill="#fff"/><text x="480" y="34" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">ダイオードの向き：縞のある足（カソード）を、電池の ＋ 側へ</text><text x="30" y="80" font-size="16" fill="#222" text-anchor="start" font-weight="bold">① Tinkercad の部品</text><line x1="60" y1="175" x2="150" y2="175" stroke="#888" stroke-width="5" stroke-linecap="round"/><path d="M60,175 L100,175" stroke="#888" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="100" y="156" width="70" height="38" rx="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><rect x="148" y="156" width="8" height="38" rx="0" fill="#9ab0c4" stroke="#9ab0c4" stroke-width="1"/><line x1="170" y1="175" x2="215" y2="175" stroke="#888" stroke-width="5" stroke-linecap="round"/><text x="60" y="232" font-size="14" fill="#333" text-anchor="start" font-weight="normal">縞なし</text><text x="60" y="250" font-size="14" fill="#333" text-anchor="start" font-weight="normal">（アノード）</text><text x="158" y="232" font-size="14" fill="#333" text-anchor="start" font-weight="normal">縞あり</text><text x="158" y="250" font-size="14" fill="#333" text-anchor="start" font-weight="normal">（カソード）</text><text x="300" y="80" font-size="16" fill="#222" text-anchor="start" font-weight="bold">② 回路図の記号</text><line x1="300" y1="175" x2="335" y2="175" stroke="#333" stroke-width="3" stroke-linecap="round"/><path d="M335,148 L335,202 L400,175 Z" stroke="#333" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round"/><line x1="400" y1="148" x2="400" y2="202" stroke="#333" stroke-width="4" stroke-linecap="round"/><line x1="400" y1="175" x2="435" y2="175" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="335" y="232" font-size="14" fill="#333" text-anchor="end" font-weight="normal">アノード</text><text x="335" y="250" font-size="13" fill="#666" text-anchor="end" font-weight="normal">（三角の底）</text><text x="408" y="232" font-size="14" fill="#333" text-anchor="start" font-weight="normal">カソード</text><text x="408" y="250" font-size="13" fill="#666" text-anchor="start" font-weight="normal">（縦棒＝縞）</text><line x1="335" y1="130" x2="400" y2="130" stroke="#333" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><text x="367" y="120" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">電流はこの向きだけ流れる</text><text x="540" y="80" font-size="16" fill="#222" text-anchor="start" font-weight="bold">③ 今日の回路での向き</text><text x="540" y="112" font-size="16" fill="#1a7f1a" text-anchor="start" font-weight="bold">縞（カソード）＝ 電池の ＋ 側</text><text x="540" y="136" font-size="16" fill="#1a7f1a" text-anchor="start" font-weight="bold">縞なし（アノード）＝ コレクタ側</text><rect x="30" y="270" width="900" height="140" rx="8" fill="#f4fbf4" stroke="#1a7f1a" stroke-width="2"/><text x="50" y="308" font-size="18" fill="#1a7f1a" text-anchor="start" font-weight="bold">○ 正しい</text><text x="50" y="344" font-size="15" fill="#333" text-anchor="start" font-weight="normal">電池の ＋ の列</text><line x1="190" y1="340" x2="300" y2="340" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="316" x2="300" y2="364" stroke="#333" stroke-width="4" stroke-linecap="round"/><path d="M300,340 L370,316 L370,364 Z" stroke="#333" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="384" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">カソード</text><text x="300" y="400" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">（縞）</text><text x="370" y="384" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">アノード</text><line x1="370" y1="340" x2="470" y2="340" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="480" y="344" font-size="15" fill="#333" text-anchor="start" font-weight="normal">コレクタ側（モーターの下）</text><text x="695" y="320" font-size="14" fill="#1a7f1a" text-anchor="start" font-weight="normal">トランジスタが OFF の直後、</text><text x="695" y="340" font-size="14" fill="#1a7f1a" text-anchor="start" font-weight="normal">モーターの電流が</text><text x="695" y="360" font-size="14" fill="#1a7f1a" text-anchor="start" font-weight="normal">ダイオードを通って逃げる</text><rect x="30" y="420" width="900" height="140" rx="8" fill="#fdf1f1" stroke="#c00000" stroke-width="2"/><text x="50" y="458" font-size="18" fill="#c00000" text-anchor="start" font-weight="bold">× 逆（今日の最初の2回）</text><text x="50" y="494" font-size="15" fill="#333" text-anchor="start" font-weight="normal">電池の ＋ の列</text><line x1="190" y1="490" x2="300" y2="490" stroke="#333" stroke-width="3" stroke-linecap="round"/><path d="M300,466 L300,514 L370,490 Z" stroke="#333" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round"/><line x1="370" y1="466" x2="370" y2="514" stroke="#333" stroke-width="4" stroke-linecap="round"/><text x="300" y="534" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">アノード</text><text x="370" y="534" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">カソード</text><text x="370" y="550" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">（縞）</text><line x1="370" y1="490" x2="470" y2="490" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="480" y="494" font-size="15" fill="#333" text-anchor="start" font-weight="normal">コレクタ側（モーターの下）</text><text x="695" y="464" font-size="14" fill="#c00000" text-anchor="start" font-weight="normal">ON のとき、電池の ＋ から</text><text x="695" y="484" font-size="14" fill="#c00000" text-anchor="start" font-weight="normal">ダイオードを通って</text><text x="695" y="504" font-size="14" fill="#c00000" text-anchor="start" font-weight="normal">コレクタへ流れてしまい、</text><text x="695" y="524" font-size="14" fill="#c00000" text-anchor="start" font-weight="normal">モーターを通らない</text></svg>