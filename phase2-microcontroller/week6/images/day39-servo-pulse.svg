<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1100" height="640" fill="#fff"/><text x="550" y="32" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">サーボに送る信号：20ms ごとにくり返し、HIGH の「長さ」で角度を伝える</text><text x="20" y="66" font-size="14" fill="#555" text-anchor="start" font-weight="normal">角度が変わっても、くり返しの間隔（20ms）は、いつも同じ。変わるのは、HIGH（5V）の長さだけ。</text><text x="20" y="150" font-size="22" fill="#2a8a2a" text-anchor="start" font-weight="bold">write(0)</text><text x="20" y="178" font-size="15" fill="#444" text-anchor="start" font-weight="normal">0度の注文</text><text x="20" y="202" font-size="15" fill="#2a8a2a" text-anchor="start" font-weight="bold">HIGH の長さ 約 0.544ms</text><text x="20" y="224" font-size="14" fill="#666" text-anchor="start" font-weight="normal">（544 マイクロ秒）</text><line x1="290" y1="200" x2="1090" y2="200" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M300,200 L300,140 L314.144,140 L314.144,200 L820.0,200 L820.0,140 L834.144,140 L834.144,200 L1090,200" stroke="#2a8a2a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="126" x2="314.144" y2="126" stroke="#2a8a2a" stroke-width="2" stroke-linecap="round"/><text x="322.144" y="130" font-size="14" fill="#2a8a2a" text-anchor="start" font-weight="bold">0.544ms</text><line x1="300" y1="222" x2="820.0" y2="222" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><line x1="820.0" y1="222" x2="300" y2="222" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><text x="560.0" y="242" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">20ms（毎回、同じ間隔）</text><text x="290" y="145" font-size="13" fill="#666" text-anchor="end" font-weight="normal">5V</text><text x="290" y="205" font-size="13" fill="#666" text-anchor="end" font-weight="normal">0V</text><text x="20" y="310" font-size="22" fill="#1f5fbf" text-anchor="start" font-weight="bold">write(90)</text><text x="20" y="338" font-size="15" fill="#444" text-anchor="start" font-weight="normal">90度の注文</text><text x="20" y="362" font-size="15" fill="#1f5fbf" text-anchor="start" font-weight="bold">HIGH の長さ 約 1.472ms</text><text x="20" y="384" font-size="14" fill="#666" text-anchor="start" font-weight="normal">（1472 マイクロ秒）</text><line x1="290" y1="360" x2="1090" y2="360" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M300,360 L300,300 L338.272,300 L338.272,360 L820.0,360 L820.0,300 L858.272,300 L858.272,360 L1090,360" stroke="#1f5fbf" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="286" x2="338.272" y2="286" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round"/><text x="346.272" y="290" font-size="14" fill="#1f5fbf" text-anchor="start" font-weight="bold">1.472ms</text><line x1="300" y1="382" x2="820.0" y2="382" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><line x1="820.0" y1="382" x2="300" y2="382" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><text x="560.0" y="402" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">20ms（毎回、同じ間隔）</text><text x="290" y="305" font-size="13" fill="#666" text-anchor="end" font-weight="normal">5V</text><text x="290" y="365" font-size="13" fill="#666" text-anchor="end" font-weight="normal">0V</text><text x="20" y="470" font-size="22" fill="#d9660a" text-anchor="start" font-weight="bold">write(180)</text><text x="20" y="498" font-size="15" fill="#444" text-anchor="start" font-weight="normal">180度の注文</text><text x="20" y="522" font-size="15" fill="#d9660a" text-anchor="start" font-weight="bold">HIGH の長さ 約 2.4ms</text><text x="20" y="544" font-size="14" fill="#666" text-anchor="start" font-weight="normal">（2400 マイクロ秒）</text><line x1="290" y1="520" x2="1090" y2="520" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M300,520 L300,460 L362.4,460 L362.4,520 L820.0,520 L820.0,460 L882.4,460 L882.4,520 L1090,520" stroke="#d9660a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="446" x2="362.4" y2="446" stroke="#d9660a" stroke-width="2" stroke-linecap="round"/><text x="370.4" y="450" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">2.4ms</text><line x1="300" y1="542" x2="820.0" y2="542" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><line x1="820.0" y1="542" x2="300" y2="542" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><text x="560.0" y="562" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">20ms（毎回、同じ間隔）</text><text x="290" y="465" font-size="13" fill="#666" text-anchor="end" font-weight="normal">5V</text><text x="290" y="525" font-size="13" fill="#666" text-anchor="end" font-weight="normal">0V</text></svg>