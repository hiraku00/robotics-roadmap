<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1000" height="620" fill="#fff"/><text x="500" y="32" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">write(135) から、サーボの腕が動くまで（閉ループ）</text><rect x="20" y="70" width="220" height="90" rx="8" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/><text x="130.0" y="110.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">① あなたのコード</text><text x="130.0" y="130.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">myservo.write(135);</text><rect x="280" y="70" width="240" height="90" rx="8" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/><text x="400.0" y="100.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">② Servo ライブラリ</text><text x="400.0" y="120.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">135度 → 約1936マイクロ秒</text><text x="400.0" y="140.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">と計算する</text><rect x="560" y="70" width="240" height="90" rx="8" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/><text x="680.0" y="100.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">③ ピン9</text><text x="680.0" y="120.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">20ms ごとに 1936マイクロ秒</text><text x="680.0" y="140.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">の HIGH を出し続ける</text><rect x="840" y="70" width="140" height="90" rx="8" fill="#fff4e0" stroke="#d9660a" stroke-width="2"/><text x="910.0" y="110.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">④ サーボへ</text><text x="910.0" y="130.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">（オレンジの線）</text><line x1="240" y1="115.0" x2="280" y2="115.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><line x1="520" y1="115.0" x2="560" y2="115.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><line x1="800" y1="115.0" x2="840" y2="115.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><rect x="30" y="210" width="940" height="250" rx="12" fill="#fffbea" stroke="#b58900" stroke-width="3"/><text x="50" y="238" font-size="17" fill="#8a6a00" text-anchor="start" font-weight="bold">サーボの中（記事外の一般的な説明）</text><rect x="50" y="280" width="170" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="135.0" y="310.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">⑤ 注文</text><text x="135.0" y="330.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">（パルスの長さ）</text><rect x="270" y="280" width="150" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="345.0" y="310.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">⑥ 比べる回路</text><text x="345.0" y="330.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">注文 と 今の角度</text><rect x="470" y="280" width="130" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="535.0" y="310.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">⑦ モーター</text><text x="535.0" y="330.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">回る</text><rect x="650" y="280" width="110" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="705.0" y="310.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">⑧ 腕</text><text x="705.0" y="330.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">の角度</text><rect x="800" y="280" width="150" height="70" rx="8" fill="#e6f4e6" stroke="#2a8a2a" stroke-width="2"/><text x="875.0" y="310.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">⑨ 角度センサ</text><text x="875.0" y="330.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">（中の可変抵抗）</text><line x1="220" y1="315.0" x2="270" y2="315.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><line x1="420" y1="315.0" x2="470" y2="315.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><line x1="600" y1="315.0" x2="650" y2="315.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><line x1="760" y1="315.0" x2="800" y2="315.0" stroke="#333" stroke-width="3" stroke-linecap="round" marker-end="url(#ak)"/><path d="M875,350 L875,400 L345,400 L345,352" stroke="#2a8a2a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ak)"/><text x="610" y="390" font-size="15" fill="#2a8a2a" text-anchor="middle" font-weight="bold">今の角度を、測って戻す ＝ 閉ループ</text><line x1="490" y1="160" x2="490" y2="210" stroke="#bbb" stroke-width="1" stroke-linecap="round"/><line x1="910" y1="160" x2="910" y2="210" stroke="#d9660a" stroke-width="3" stroke-linecap="round" marker-end="url(#ao)"/><rect x="30" y="500" width="300" height="80" rx="8" fill="#fdf1f1" stroke="#c00000" stroke-width="2"/><text x="180.0" y="535.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">Arduino（ピン9、5V、GND の3本）</text><text x="180.0" y="555.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">実際の角度を返す線は、ない</text><line x1="330" y1="540" x2="640" y2="540" stroke="#c00000" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 6"/><text x="485" y="530" font-size="15" fill="#c00000" text-anchor="middle" font-weight="bold">角度は返ってこない</text><text x="485" y="562" font-size="15" fill="#c00000" text-anchor="middle" font-weight="bold">× 外からは、今の角度が分からない</text><rect x="660" y="500" width="310" height="80" rx="8" fill="#f4fbf4" stroke="#2a8a2a" stroke-width="2"/><text x="815.0" y="535.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">サーボの中だけで、</text><text x="815.0" y="555.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">「注文」に「今の角度」を合わせている</text></svg>