<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="560" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">トランジスタでモーターを回す：細い道（ベース）で、太い道（コレクタ）を ON/OFF する</text>
<rect x="30" y="270" width="120" height="60" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
<text x="90" y="297" font-size="13" fill="#00796b" text-anchor="middle" font-weight="bold">Arduino</text>
<text x="90" y="317" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">ピン2</text>
<path d="M150,300 L210,300" fill="none" stroke="#e65100" stroke-width="3"/>
<path d="M210,300 L216.7,291 L230.0,309 L243.3,291 L256.7,309 L270.0,291 L283.3,309 L290,300" fill="none" stroke="#e65100" stroke-width="2.5"/>
<text x="250" y="280" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">625Ω</text>
<path d="M290,300 L440,300" fill="none" stroke="#e65100" stroke-width="3" marker-end="url(#ao)"/>
<path d="M440,262 L440,338" fill="none" stroke="#222" stroke-width="5"/>
<path d="M440,285 L500,250 L500,205" fill="none" stroke="#222" stroke-width="3"/>
<path d="M440,315 L500,350" fill="none" stroke="#222" stroke-width="3"/>
<path d="M500,350 L500,440" fill="none" stroke="#222" stroke-width="3"/>
<path d="M492,342 L500,350 L490,352 z" fill="#222"/>
<text x="420" y="296" font-size="15" fill="#e65100" text-anchor="end" font-weight="bold">B</text>
<text x="516" y="245" font-size="15" fill="#c62828" text-anchor="start" font-weight="bold">C</text>
<text x="516" y="360" font-size="15" fill="#222" text-anchor="start" font-weight="bold">E</text>
<text x="445" y="245" font-size="12" fill="#555" text-anchor="end">NPN トランジスタ</text>
<circle cx="500" cy="150" r="36" fill="#fff3e0" stroke="#c62828" stroke-width="3"/>
<text x="500" y="160" font-size="28" fill="#c62828" text-anchor="middle" font-weight="bold">M</text>
<path d="M500,186 L500,205" fill="none" stroke="#c62828" stroke-width="3.5"/>
<path d="M500,114 L500,80 L770,80" fill="none" stroke="#c62828" stroke-width="3.5"/>
<rect x="740" y="80" width="120" height="90" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="800" y="112" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">電池</text>
<text x="800" y="136" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">3V</text>
<text x="800" y="70" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">＋</text>
<path d="M800,170 L800,440" fill="none" stroke="#222" stroke-width="3"/>
<text x="815" y="190" font-size="16" fill="#222" text-anchor="start" font-weight="bold">−</text>
<path d="M90,440 L800,440" fill="none" stroke="#222" stroke-width="3.5"/>
<path d="M90,330 L90,440" fill="none" stroke="#222" stroke-width="3"/>
<text x="450" y="470" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">GND（Arduino の GND と、電池の − を、つなぐ＝共通）</text>
<text x="150" y="255" font-size="13" fill="#e65100" text-anchor="start" font-weight="bold">ベース電流</text>
<text x="150" y="238" font-size="13" fill="#e65100" text-anchor="start" font-weight="bold">約 6.9mA（細い道）</text>
<path d="M560,220 L560,400" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#ar)"/>
<text x="575" y="290" font-size="13" fill="#c62828" text-anchor="start" font-weight="bold">コレクタ電流</text>
<text x="575" y="310" font-size="13" fill="#c62828" text-anchor="start" font-weight="bold">数百 mA（太い道）</text>
<rect x="30" y="490" width="920" height="50" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="514" font-size="13.5" fill="#222" text-anchor="middle" font-weight="bold">ピンは、細い道（ベース）に少し流すだけ。モーターの大きな電流は、電池から、コレクタ → エミッタ → GND へ流れる</text>
<text x="490" y="534" font-size="12.5" fill="#555" text-anchor="middle">たとえ：蛇口（ベース）を少しひねると、水道管（コレクタ）の大きな水量が、流れ出す</text>
</svg>
