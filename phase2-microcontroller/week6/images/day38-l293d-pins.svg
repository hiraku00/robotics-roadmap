<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1000" height="640" fill="#fff"/><text x="500" y="32" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">L293D の足と、つなぎ先（記事の ESP32 → 今日の Arduino UNO）</text><rect x="400" y="74" width="200" height="456" rx="8" fill="#fff8d6" stroke="#333" stroke-width="3"/><text x="500" y="314" font-size="22" fill="#333" text-anchor="middle" font-weight="bold">L293D</text><path d="M480,74 A20,20 0 0,0 520,74" stroke="#333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="366" y1="116" x2="400" y2="116" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="121" font-size="15" fill="#333" text-anchor="start" font-weight="normal">1  1,2EN</text><line x1="366" y1="116" x2="340" y2="116" stroke="#c00000" stroke-width="3" stroke-linecap="round"/><text x="332" y="121" font-size="15" fill="#c00000" text-anchor="end" font-weight="bold">5V（1・2回目）／~9（EN の回路）</text><line x1="366" y1="172" x2="400" y2="172" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="177" font-size="15" fill="#333" text-anchor="start" font-weight="normal">2  1A</text><line x1="366" y1="172" x2="340" y2="172" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/><text x="332" y="177" font-size="15" fill="#1f5fbf" text-anchor="end" font-weight="bold">~11（青）</text><line x1="366" y1="228" x2="400" y2="228" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="233" font-size="15" fill="#333" text-anchor="start" font-weight="normal">3  1Y</text><line x1="366" y1="228" x2="340" y2="228" stroke="#b58900" stroke-width="3" stroke-linecap="round"/><text x="332" y="233" font-size="15" fill="#b58900" text-anchor="end" font-weight="bold">モーターの ＋（黄）</text><line x1="366" y1="284" x2="400" y2="284" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="289" font-size="15" fill="#333" text-anchor="start" font-weight="normal">4  GND</text><line x1="366" y1="284" x2="340" y2="284" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="332" y="289" font-size="15" fill="#333" text-anchor="end" font-weight="bold">GND（黒）</text><line x1="366" y1="340" x2="400" y2="340" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="345" font-size="15" fill="#333" text-anchor="start" font-weight="normal">5  GND</text><line x1="366" y1="340" x2="340" y2="340" stroke="#888" stroke-width="3" stroke-linecap="round"/><text x="332" y="345" font-size="15" fill="#888" text-anchor="end" font-weight="normal">（チップの中で、4 と同じ GND）</text><line x1="366" y1="396" x2="400" y2="396" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="401" font-size="15" fill="#333" text-anchor="start" font-weight="normal">6  2Y</text><line x1="366" y1="396" x2="340" y2="396" stroke="#2a8a2a" stroke-width="3" stroke-linecap="round"/><text x="332" y="401" font-size="15" fill="#2a8a2a" text-anchor="end" font-weight="bold">モーターの −（緑）</text><line x1="366" y1="452" x2="400" y2="452" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="457" font-size="15" fill="#333" text-anchor="start" font-weight="normal">7  2A</text><line x1="366" y1="452" x2="340" y2="452" stroke="#d9660a" stroke-width="3" stroke-linecap="round"/><text x="332" y="457" font-size="15" fill="#d9660a" text-anchor="end" font-weight="bold">~10（オレンジ）</text><line x1="366" y1="508" x2="400" y2="508" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="410" y="513" font-size="15" fill="#333" text-anchor="start" font-weight="normal">8  VCC2</text><line x1="366" y1="508" x2="340" y2="508" stroke="#c00000" stroke-width="3" stroke-linecap="round"/><text x="332" y="513" font-size="15" fill="#c00000" text-anchor="end" font-weight="bold">5V（短い赤。モーターの電源）</text><line x1="600" y1="116" x2="634" y2="116" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="121" font-size="15" fill="#333" text-anchor="end" font-weight="normal">VCC1  16</text><text x="644" y="121" font-size="15" fill="#c00000" text-anchor="start" font-weight="bold">5V（長い赤。チップの電源）</text><line x1="600" y1="172" x2="634" y2="172" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="177" font-size="15" fill="#333" text-anchor="end" font-weight="normal">4A  15</text><text x="644" y="177" font-size="15" fill="#aaa" text-anchor="start" font-weight="normal">使わない</text><line x1="600" y1="228" x2="634" y2="228" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="233" font-size="15" fill="#333" text-anchor="end" font-weight="normal">4Y  14</text><text x="644" y="233" font-size="15" fill="#aaa" text-anchor="start" font-weight="normal">使わない</text><line x1="600" y1="284" x2="634" y2="284" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="289" font-size="15" fill="#333" text-anchor="end" font-weight="normal">GND  13</text><text x="644" y="289" font-size="15" fill="#888" text-anchor="start" font-weight="normal">（GND の仲間）</text><line x1="600" y1="340" x2="634" y2="340" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="345" font-size="15" fill="#333" text-anchor="end" font-weight="normal">GND  12</text><text x="644" y="345" font-size="15" fill="#888" text-anchor="start" font-weight="normal">（GND の仲間）</text><line x1="600" y1="396" x2="634" y2="396" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="401" font-size="15" fill="#333" text-anchor="end" font-weight="normal">3Y  11</text><text x="644" y="401" font-size="15" fill="#aaa" text-anchor="start" font-weight="normal">使わない</text><line x1="600" y1="452" x2="634" y2="452" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="457" font-size="15" fill="#333" text-anchor="end" font-weight="normal">3A  10</text><text x="644" y="457" font-size="15" fill="#aaa" text-anchor="start" font-weight="normal">使わない</text><line x1="600" y1="508" x2="634" y2="508" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="588" y="513" font-size="15" fill="#333" text-anchor="end" font-weight="normal">3,4EN  9</text><text x="644" y="513" font-size="15" fill="#aaa" text-anchor="start" font-weight="normal">使わない（2つめのモーター用）</text><text x="20" y="580" font-size="14" fill="#444" text-anchor="start" font-weight="normal">記事の色：青＝IO13 → 1A、黒＝GND、オレンジ＝IO14 → 2A（記事は ESP32。UNO では、青＝~11、オレンジ＝~10 にした）</text><text x="20" y="604" font-size="14" fill="#444" text-anchor="start" font-weight="normal">足の番号は、記事の回路図の番号。1・2回目の回路は、1番ピンを 5V につないでいた</text></svg>