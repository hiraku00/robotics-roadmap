<text x="490" y="360" font-size="12.5" fill="#222" text-anchor="middle">ベース電流 ＝（5V − 0.7V）÷ ベース抵抗（計算）。記事の計算（5V ÷ 8mA）は、0.7V を引かない</text>
<rect x="30" y="385" width="920" height="50" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="408" font-size="13.5" fill="#222" text-anchor="middle" font-weight="bold">ベース電流が小さいと、コレクタに流せる電流が足りず、始動できない。小さくしすぎると、回らない</text>
<text x="490" y="428" font-size="12" fill="#555" text-anchor="middle">（Tinkercad の部品は、記事の 2SC2120-Y と FA-130RA とは別物。境目の値は、部品によってちがう）</text>
