<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="980" height="470" fill="#fff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
</defs>
<text x="490.0" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">ピンと、モーターの電流：25倍〜40倍のちがい</text>
<text x="30" y="126" font-size="14" fill="#222" text-anchor="start" font-weight="bold">Arduino のピン1本の上限</text>
<rect x="330" y="100" width="10.5" height="38" fill="#1565c0" opacity="0.85" rx="4"/>
<text x="350.5" y="126" font-size="13.5" fill="#222" text-anchor="start" font-weight="bold">20mA（記事）</text>
<text x="30" y="196" font-size="14" fill="#222" text-anchor="start" font-weight="bold">LED（29日目）</text>
<rect x="330" y="170" width="7.1" height="38" fill="#2e7d32" opacity="0.85" rx="4"/>
<text x="347.14" y="196" font-size="13.5" fill="#222" text-anchor="start" font-weight="bold">約 13.6mA（計算）</text>
<text x="30" y="266" font-size="14" fill="#222" text-anchor="start" font-weight="bold">モーター：回っているとき</text>
<rect x="330" y="240" width="262.5" height="38" fill="#e65100" opacity="0.85" rx="4"/>
<text x="602.5" y="266" font-size="13.5" fill="#222" text-anchor="start" font-weight="bold">500mA（FA-130RA の仕様）</text>
<text x="30" y="336" font-size="14" fill="#222" text-anchor="start" font-weight="bold">モーター：回り始め（突入電流）</text>
<rect x="330" y="310" width="420.0" height="38" fill="#c62828" opacity="0.85" rx="4"/>
<text x="760.0" y="336" font-size="13.5" fill="#222" text-anchor="start" font-weight="bold">約 800mA（記事）</text>
<rect x="30" y="390" width="920" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="490" y="414" font-size="14.5" fill="#222" text-anchor="middle" font-weight="bold">500mA ÷ 20mA ＝ 25倍、800mA ÷ 20mA ＝ 40倍（計算）。ピンから、直接は回せない</text>
<text x="490" y="438" font-size="13" fill="#555" text-anchor="middle">だから、トランジスタで、電池の電流を、ピンの小さな信号で、ON/OFF する</text>
</svg>
