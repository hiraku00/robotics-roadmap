<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9660a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1000" height="520" fill="#fff"/><text x="500" y="34" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">モーターを止める瞬間に出る「逆起電力」と、ダイオードの役目</text><text x="20" y="74" font-size="18" fill="#1f5fbf" text-anchor="start" font-weight="bold">① トランジスタ ON</text><text x="520" y="74" font-size="18" fill="#d9660a" text-anchor="start" font-weight="bold">② OFF の直後（ダイオードがある場合）</text><line x1="40" y1="130" x2="400" y2="130" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="40" y="94" font-size="15" fill="#c00000" text-anchor="start" font-weight="bold">電池の ＋（3V）</text><line x1="120" y1="130" x2="120" y2="168" stroke="#333" stroke-width="3" stroke-linecap="round"/><circle cx="120" cy="210" r="42" fill="#fff4cc" stroke="#333" stroke-width="3"/><text x="120" y="218" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">M</text><line x1="120" y1="252" x2="120" y2="330" stroke="#333" stroke-width="3" stroke-linecap="round"/><circle cx="120" cy="330" r="5" fill="#333" stroke="#333" stroke-width="2"/><text x="132" y="322" font-size="14" fill="#333" text-anchor="start" font-weight="normal">コレクタ</text><line x1="340" y1="130" x2="340" y2="170" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="324" y1="205" x2="356" y2="205" stroke="#333" stroke-width="4" stroke-linecap="round"/><path d="M324,243 L356,243 L340,207 Z" stroke="#333" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round"/><line x1="340" y1="248" x2="340" y2="330" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="120" y1="330" x2="340" y2="330" stroke="#333" stroke-width="3" stroke-linecap="round"/><circle cx="340" cy="130" r="5" fill="#333" stroke="#333" stroke-width="2"/><text x="368" y="230" font-size="14" fill="#333" text-anchor="start" font-weight="normal">ダイオード</text><text x="368" y="248" font-size="13" fill="#666" text-anchor="start" font-weight="normal">（縞＝＋側）</text><rect x="58" y="366" width="124" height="46" rx="6" fill="#d6f0d6" stroke="#333" stroke-width="2"/><text x="120" y="395" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">トランジスタ ON</text><line x1="120" y1="330" x2="120" y2="366" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="120" y1="412" x2="120" y2="450" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="450" x2="400" y2="450" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="40" y="472" font-size="15" fill="#333" text-anchor="start" font-weight="normal">GND（電池の −）</text><line x1="54" y1="140" x2="54" y2="442" stroke="#1f5fbf" stroke-width="5" stroke-linecap="round" marker-end="url(#ab)"/><text x="174" y="214" font-size="15" fill="#1f5fbf" text-anchor="start" font-weight="bold">電流が流れて回る</text><text x="368" y="280" font-size="14" fill="#888" text-anchor="start" font-weight="normal">電流なし</text><text x="368" y="298" font-size="13" fill="#888" text-anchor="start" font-weight="normal">（逆向きなので）</text><text x="368" y="314" font-size="13" fill="#888" text-anchor="start" font-weight="normal">（流れない）</text><line x1="540" y1="130" x2="900" y2="130" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="540" y="94" font-size="15" fill="#c00000" text-anchor="start" font-weight="bold">電池の ＋（3V）</text><line x1="620" y1="130" x2="620" y2="168" stroke="#333" stroke-width="3" stroke-linecap="round"/><circle cx="620" cy="210" r="42" fill="#fff4cc" stroke="#333" stroke-width="3"/><text x="620" y="218" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">M</text><line x1="620" y1="252" x2="620" y2="330" stroke="#333" stroke-width="3" stroke-linecap="round"/><circle cx="620" cy="330" r="5" fill="#333" stroke="#333" stroke-width="2"/><text x="632" y="322" font-size="14" fill="#333" text-anchor="start" font-weight="normal">コレクタ</text><line x1="840" y1="130" x2="840" y2="170" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="824" y1="205" x2="856" y2="205" stroke="#333" stroke-width="4" stroke-linecap="round"/><path d="M824,243 L856,243 L840,207 Z" stroke="#333" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round"/><line x1="840" y1="248" x2="840" y2="330" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="620" y1="330" x2="840" y2="330" stroke="#333" stroke-width="3" stroke-linecap="round"/><circle cx="840" cy="130" r="5" fill="#333" stroke="#333" stroke-width="2"/><text x="868" y="230" font-size="14" fill="#333" text-anchor="start" font-weight="normal">ダイオード</text><text x="868" y="248" font-size="13" fill="#666" text-anchor="start" font-weight="normal">（縞＝＋側）</text><rect x="558" y="366" width="124" height="46" rx="6" fill="#f6d6d6" stroke="#333" stroke-width="2"/><text x="620" y="395" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">トランジスタ OFF</text><line x1="620" y1="330" x2="620" y2="366" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="620" y1="412" x2="620" y2="450" stroke="#333" stroke-width="3" stroke-linecap="round"/><line x1="540" y1="450" x2="900" y2="450" stroke="#333" stroke-width="3" stroke-linecap="round"/><text x="540" y="472" font-size="15" fill="#333" text-anchor="start" font-weight="normal">GND（電池の −）</text><line x1="554" y1="140" x2="554" y2="320" stroke="#d9660a" stroke-width="5" stroke-linecap="round" marker-end="url(#ao)"/><path d="M554,320 L554,344 L862,344 L862,108 L660,108" stroke="#d9660a" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ao)"/><text x="674" y="200" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">モーターの電流は</text><text x="674" y="220" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold">すぐには0にならない</text><text x="560" y="358" font-size="14" fill="#d9660a" text-anchor="start" font-weight="bold"></text><line x1="500" y1="90" x2="500" y2="500" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="20" y="505" font-size="13" fill="#555" text-anchor="start" font-weight="normal">ダイオードがないと、②のときコレクタが一瞬とても高い電圧になる（記事：電圧の数十倍になることがある）。トランジスタが壊れるおそれがある。</text></svg>